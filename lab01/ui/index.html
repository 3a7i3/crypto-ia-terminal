<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAB-01 — Expériences synthétiques</title>
<style>
:root{--bg:#0f1b2d;--fg:#e8eef7;--mut:#9fb0c8;--card:#17263d;--ok:#4cc38a;--ko:#ff7a7a;--warn:#f2c14e}
@media (prefers-color-scheme:light){:root{--bg:#f4f7fb;--fg:#12233a;--mut:#4a5f7a;--card:#fff;--ok:#12805a;--ko:#b3261e;--warn:#8a6100}}
body{margin:0;overflow-wrap:anywhere;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:0 16px 32px}
.banner{background:var(--warn);color:#111;padding:10px 16px;font-weight:700;text-align:center}
.card{background:var(--card);border-radius:10px;padding:12px 14px;margin:12px 0}
button,input{font:inherit}button{cursor:pointer;background:none;color:var(--fg);border:1px solid var(--mut);border-radius:8px;padding:6px 10px}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--ko);font-weight:700}.mut{color:var(--mut)}
code{overflow-wrap:anywhere}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:4px 6px;border-bottom:1px solid #8884;vertical-align:top}
.wrap{overflow-x:auto}
</style></head><body>
<div class="banner" role="note">DONNÉES SYNTHÉTIQUES — laboratoire LAB-01 · ni runtime, ni PPL/FIN, ni Research</div>
<main>
<h1>Expériences LAB-01</h1>
<div class="card"><label>Jeton (si l'API est protégée) <input id="tok" type="password" autocomplete="off"></label>
<button id="go">Charger</button> <span id="msg" class="mut" role="status"></span></div>
<div id="list"></div><div id="detail"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p){const h={};const t=$('#tok').value;if(t)h.Authorization='Bearer '+t;
 const r=await fetch(p,{headers:h});const j=await r.json().catch(()=>({error:'REPONSE_ILLISIBLE'}));
 if(!r.ok)throw new Error(r.status+' '+(j.error||''));return j}
async function load(){$('#msg').textContent='Chargement…';
 try{const j=await api('/lab/experiments');$('#msg').textContent=j.experiments.length+' expérience(s) · provenance '+j.provenance;
 $('#list').innerHTML=j.experiments.map(e=>`<div class="card"><b>${esc(e.title)}</b>
 <span class="${e.verdict==='PASS'?'pass':'fail'}">${esc(e.verdict)}</span><br>
 <code>${esc(e.experiment_id)}</code><br><span class="mut">trace ${esc(e.trace_id)} · état final ${esc(e.final_state)}
 ${e.risk_reason_code?' · risque '+esc(e.risk_reason_code):''}${e.error_code?' · erreur '+esc(e.error_code):''}
 ${e.synthetic_pnl_usd!=null?' · PnL synthétique '+esc(e.synthetic_pnl_usd):''}</span><br>
 <button data-id="${esc(e.experiment_id)}">Détails</button></div>`).join('')}
 catch(e){$('#list').innerHTML='';$('#msg').textContent='Lecture impossible : '+e.message+' (ce n\'est pas une liste vide)'}}
async function detail(id){try{const[r,ev]=await Promise.all([api('/lab/experiments/'+id),api('/lab/experiments/'+id+'/events')]);
 $('#detail').innerHTML=`<div class="card"><h2>${esc(r.title)}</h2><p><code>${esc(r.experiment_id)}</code> · trace <code>${esc(r.trace_id)}</code> · provenance <b>${esc(r.provenance)}</b> · scénario ${esc(r.scenario)} · état final ${esc(r.final_state)} · <span class="${r.verdict==='PASS'?'pass':'fail'}">${esc(r.verdict)}</span></p><p class="mut">code <code>${esc(r.code_digest.slice(0,16))}…</code> ·
 config <code>${esc(r.config_digest.slice(0,16))}…</code> · seed ${esc(r.seed)} · empreinte événements <code>${esc(r.events_digest.slice(0,16))}…</code></p>
 <h3>Critères</h3><div class="wrap"><table>${r.criteria.map(c=>`<tr><td class="${c.passed?'pass':'fail'}">${c.passed?'OK':'KO'}</td><td>${esc(c.description)}</td>
 <td class="mut">observé ${esc(JSON.stringify(c.observed))}</td></tr>`).join('')}</table></div>
 <h3>Événements horodatés (horloge synthétique)</h3><div class="wrap"><table>${ev.events.map(e=>`<tr><td>${e.seq}</td><td><code>${esc(e.ts_synthetic)}</code></td>
 <td>${esc(e.type)}</td><td class="mut"><code>${esc(JSON.stringify(e.payload).slice(0,160))}</code></td></tr>`).join('')}</table></div></div>`}
 catch(e){$('#detail').innerHTML='<div class="card fail">Lecture impossible : '+esc(e.message)+'</div>'}}
$('#go').onclick=load;$('#list').onclick=e=>{const id=e.target.dataset&&e.target.dataset.id;if(id)detail(id)};load();
</script></body></html>
