# .pre-commit-config.yaml
# Pre-commit hooks for linting, formatting, and security
repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        exclude: ^_ARCHIVE_2026/
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-r", "quant_hedge_ai", "supervision", "scripts", "-f", "json", "--exit-zero"]
        pass_filenames: false
  # Secret detection — refuse tout commit contenant une clé/token/credential.
  # Ajouté après l'incident du token Dash0 committé dans .claude/settings.local.json
  # (repo public). Contrairement à bandit ci-dessus, ce hook BLOQUE (pas d'exit-zero).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
