    - "regles CONTOURNEES ou ignorees en pratique"
    - "rapports DIVERGENTS produits a partir des memes faits"
    - "temps passe a remplir le protocole vs temps passe a auditer"
  success_criterion: >
    V5 n'est justifiee que par les problemes OBSERVES pendant la campagne.
    Une extension sans instance constatee reste PROPOSEE.
