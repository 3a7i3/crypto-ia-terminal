    - id: AUDIT-EMP-002
      date: "2026-07-29"
      nature: DONNEES
      trigger: >
        Une premiere lecture du lien score-PnL (Pearson r ~ 0.003, N=109) avait
        ete formulee comme "le score n'informe pas". L'operateur a objecte que
        le score est une fonction de CLASSEMENT et que Pearson n'est pas le test
        adapte : monotonicite, AUC, Spearman, IC par quantile.
      scope: >
        Snapshot VPS du 2026-07-29 22:11 UTC rapatrie en lecture seule :
        databases/paper_trades.jsonl (664 CLOSE, 121 canoniques V4) et
        databases/regret/*.jsonl (21346 observations, 18716 post-borne V4).
        Outils : system/performance_metrics.py, tools/score_calibration_audit.py.

      observations:
        - "O1 taille de position = 10.00 USD sur 121/121 trades canoniques."
        - >
          O2 friction = 0.1942 % par trade, reconstruite par difference
          (size x pnl_pct - pnl_usd), sans lire aucune config de frais. Edge
          brut = -0.4671 %. Marge = -0.6613 %. PLANCHER_NON_FRANCHI.
        - >
          O3 score des trades executes : bande [64, 77], sigma=2.76, 12 valeurs
          distinctes, 45 % de la masse sur la seule valeur 72 — soit 13 % de
          l'echelle nominale 0-100.
        - >
          O4 resolution de l'instrument a N=121 (alpha=0.05, puissance=0.80) :
          |rho| minimal detectable = 0.252. Mesure : rho=-0.018 (p=0.847 par
          permutation, 20000 tirages), AUC=0.531 [IC95 0.422 ; 0.640].
        - >
          O5 population observee (regret v2, N=18716, bande [65, 85]) : rho croit
          de facon monotone avec l'horizon — 0.0155 (5m), 0.0172 (1h), 0.0724
          (4h), 0.1542 (12h), 0.1604 (24h) ; AUC de 0.520 a 0.602 ; rendement
          signe moyen de +0.0008 % a +1.1142 %.
        - >
          O6 robustesse a 24h : rho=+0.198 (bear_trend, n=13148), +0.214
          (bull_trend), +0.177 (high_volatility), et -0.054 (sideways, n=812).
          Apres demoyennage jour+symbole rho=+0.083 (52 % conserve). Bootstrap
          par blocs de JOURS : IC95 [+0.025 ; +0.304] sur 11 jours seulement.
        - >
          O7 sorties des 121 trades : TIMEOUT 62, SL 51, TP 8. Duree moyenne de
          detention 5.92 h.
        - >
          O8 DEFAUT LATENT : _PAPER_CAPITAL est fige a l'import de
          infra.wallet_sync avec un defaut de 100 alors que .env porte 1000. Sur
          un harnais ou wallet_sync est importe avant load_dotenv, le drawdown
          passe de 0.95 % a 9.42 % face au seuil de gate de 10 %. NON reproduit
          via les CLI (les deux scripts chargent .env avant) : latent, non actif.
        - >
          O9 burnin_calibration_v3 lance en local rend NO_GO sur un blocker
          d'INSTRUMENT (gate_rejections.csv absent hors VPS), non sur une
          metrique de performance. Le verdict local n'est pas comparable au
          verdict VPS.

      falsifier_tested: >
        POSE AVANT LA MESURE : si le score n'ordonne rien a aucun horizon, ou si
        l'ordonnancement observe ne survit pas au demoyennage jour+symbole,
        l'hypothese "le score contient une information exploitable" est refutee
        pour l'epoque V4.
      falsifier_outcome: MIXTE
      falsifier_detail: >
        NON REFUTE aux horizons longs : rho=+0.16 a 24h, conserve a +0.083 apres
        demoyennage jour+symbole, IC95 par blocs de jours hors de 0. REFUTE aux
        horizons courts : rho ~ 0.017 a 1h et en dessous, indistinguable du
        bruit une fois la dependance des observations prise en compte. REFUTE en
        regime sideways (rho=-0.054, AUC=0.481). Sur la population EXECUTEE, la
        question n'a pas pu etre posee : instrument insuffisant (O3, O4).

      inference_not_observation: >
        HYPOTHESE H-HORIZON, marquee comme telle : l'horizon d'information du
        score (12-24 h) excede l'horizon de detention realise (5.92 h moyenne,
