        tools/experiment_quality_audit.py (propagation + couverture + precision),
        system/provenance.py (nouveau), tools/chain_audit.py (nouveau).
        Priorite d'instruction fixee par l'operateur : TRANSFORMATION d'abord,
        puis chaine, puis couverture normative.

      observations:
        - >
          O1 FAUX POSITIFS : les 4 defaillances TRANSFORMATION du 2026-07-29
          etaient 3 faux positifs + 1 propagation. Le motif `json\\.dump` sans
