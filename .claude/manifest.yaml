# -----------------------------------------------------------------------------
# HEALTH BASELINE — etat de reference REPRODUCTIBLE de la suite de tests
#
# La suite ne s'execute pas avec `pytest tests/ -q` : la collecte est interrompue
# par une erreur d'import PREEXISTANTE. Ce n'est pas un caveat, c'est un etat de
# reference mesure, versionne, et opposable.
#
# expected_collection_errors est un INVARIANT :
#     observe == expected  -> PASS
#     observe >  expected  -> FAIL   (nouvelle dette introduite par le ticket)
#     observe <  expected  -> la dette a diminue : mettre a jour ce bloc
# -----------------------------------------------------------------------------
health_baseline:
  suite_state: DEGRADED
  command: "python -m pytest tests/ -q --continue-on-collection-errors"
  measured_at_commit: "8cb42fb"
  expected_collection_errors: 1
  known_errors:
    - file: "tests/test_full_integration.py"
      line: 13
      reason: "ModuleNotFoundError: No module named 'tracker_system.exchange.binance_client'"
      preexisting: true
      ticket: null      # aucun ticket de campagne ne le corrige : INV-ROI-001 le refuse
      note: >
        Dette de maintenance, hors campagne. Ne rapproche ni du burn-in ni de la
        validite de la mesure de N. A traiter hors gel, jamais pendant.
  collected: 3829
  passed: 3805
  failed: 3
  skipped: 20
  xfailed: 2
  duration_s: 334
  expected_failures: 3
  known_failures:
    - "tests/paper_trading/test_paper_trade_e2e.py::TestPaperTradeCompleteLifecycle::test_mexc_simulator_market_order_complete"
    - "tests/scripts/test_sqlite_contamination_cleanup.py::test_cleanup_confirm_deletes_and_reaudits"
    - "tests/test_dataset_validator.py::test_validate_log_valid_file"
  collection_errors: 1
  # Regle de derive appliquee par le validateur (voir render_docs.py::check_health) :
  #   collection_errors > expected_collection_errors -> FAIL
  #   failed           > expected_failures           -> FAIL
  #   failed           < expected_failures           -> AMELIORATION a signaler
  known_failures_note: >
    Les 3 echecs sont PREEXISTANTS, mesures au commit 8cb42fb avant toute
    modification de tests/. Le troisieme est revelateur : DatasetValidator
    refuse schema_version=3 (attendu [1, 2]) — incoherence de version de schema
    dans le dataset, a instruire hors campagne (INV-ROI-001).
    Meme regle que les erreurs de collecte : observe > expected -> FAIL.

# -----------------------------------------------------------------------------
# GATING
# -----------------------------------------------------------------------------
gating:
  rule: >
    Ce changement modifie-t-il ce que le moteur REGARDE, ou seulement ce qu'il MONTRE ?
    MONTRE => executable, N inchange. REGARDE => GATED, reset d'epoque, ADR signe.
  default_on_doubt: GATED
  sensitive_symbols:
    - PositionManager
    - check_new_trade
    - sizing
    - risk
    - PortfolioBrain (en entree de decision)
    - seuils par regime
    - CLEAN_DATA_SINCE_*
  epoch_gate_preconditions:
    - id: P1
      text: "Checkpoint L2 du projet franchi"
      met: false
    - id: P2
      text: "N >= 100 atteint sur l'epoque V4 (CLEAN_DATA_SINCE_V4 = 2026-07-17T01:30:00Z)"
      met: false
    - id: P3
      text: "Rapport PORT-001 produit et lu par l'operateur"
      met: false
    - id: P4
      text: "ADR d'epoque redige et signe par l'operateur"
      met: false

