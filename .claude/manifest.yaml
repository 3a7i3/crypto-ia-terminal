decisions:
  - id: DEC-SHARPE-001
    question: >
      Quelle definition du Sharpe la gate B du prelive doit-elle comparer a son
      seuil de 1.0 ? Trois formules coexistent dans le depot pour le meme nom.
    authority: "OPERATEUR — deplace de facto un seuil, ADR requis (CLAUDE.md)"
    status: EN_ATTENTE
    raised: "2026-07-28"
    raised_by: "AUDIT-EMP-001"
    measured_on: "dataset canonique V4, N=106, snapshot VPS 2026-07-28"
    observations:
      - "burnin_calibration_v3 : mean/std * sqrt(252) sur pnl_pct = -1.789 (aucun seuil)"
      - "prelive_gate gate B    : mean/std sur pnl_pct           = -0.113 (seuil > 1.0)"
      - "audit                  : mean/std * sqrt(n) sur pnl_usd = -1.571 (t de Student)"
      - "Les variances de burnin et prelive divisent par n, non par n-1 (estimateur biaise)."
    why_it_matters: >
      Avec la formule de la gate B, franchir 1.0 exigerait un rendement moyen de
      4.76 % PAR TRADE a volatilite constante. Le seuil 1.0 a manifestement ete
      pense pour un Sharpe annualise. La gate B est donc structurellement
      infranchissable sur son critere Sharpe — troisieme defaut de cette famille
      apres la gate D (cablee sur NO-GO) et la gate C (infranchissable tant que
      le bot tourne), toutes deux corrigees le 2026-07-28.
    why_not_decided_now: >
      Choisir une formule ne touche aucune constante, mais change ce que le
      seuil 1.0 MESURE — donc deplace le seuil en pratique. Interdit sous gel
      sans ADR signe (CLAUDE.md, phase de validation scientifique). L'auditeur
      a mesure et expose l'incoherence ; il ne la tranche pas.
    alternatives_considered:
      - "annualiser partout (sqrt(252)) et conserver le seuil 1.0"
      - "conserver le Sharpe par trade et abaisser le seuil a une valeur atteignable"
      - "remplacer le critere Sharpe par le t de Student et raisonner en significativite"
    blocked_by: "aucune decision de seuil avant N >= 500 et CRI >= 90 (INV-4)"
    note_statistique: >
      Les deux t mesures (-1.571 sur pnl_usd net, -1.155 sur pnl_pct brut) sont
      non significatifs. La conclusion ne depend pas du choix : a N=106, absence
      de preuve suffisante que l'esperance est positive — et non preuve qu'elle
      est negative.

  - id: DEC-INIT-001
    question: >
      Faut-il rendre paresseuses les constantes de module lues via os.getenv qui
      gouvernent le capital, le risque et l'execution (15 constantes) ?
    authority: "OPERATEUR — deplace un KPI face a un seuil de gate. ADR requis."
    status: EN_ATTENTE
    raised: "2026-07-29"
    raised_by: "AUDIT-EMP-003"
    measured_on: "depot entier, tools/init_order_audit.py, 2026-07-29"
    observations:
      - "234 constantes lues a l'import dans 74 fichiers ; 15 CAPITAL/RISQUE/EXECUTION"
      - "wallet_sync._PAPER_CAPITAL : 100.0 sans .env, 1000.0 avec (PROUVE)"
      - "drawdown des 121 canoniques : 9.42 % avec base 100, 0.95 % avec base 1000"
      - "seuil de la gate B : MaxDD < 10 % — les deux valeurs se placent de part et d'autre"
      - "3 constantes sur 234 mesurees empiriquement ; 231 seulement inventoriees"
    why_it_matters: >
      Un verdict de gate qui depend de l'ordre d'import n'est pas reproductible.
      Mais le correctif n'est pas neutre : lire le capital au moment de l'appel
      ferait passer le drawdown mesure de 9.42 % a 0.95 % dans le scenario
      constate, soit une amelioration apparente de KPI produite par un
      changement d'implementation — exactement ce que le gel interdit sans ADR.
    why_not_decided_now: >
      Deux raisons distinctes. (1) AUTORITE : deplacer un KPI face a un seuil est
      une decision d'operateur (INV-4). (2) INFORMATION : la materialisation est
      prouvee sur 1 constante sur 234 ; decider pour les 15 critiques sur cette
      base serait generaliser au-dela de la mesure.
    alternatives_considered:
      - "ne rien changer et documenter la dependance (etat actuel)"
      - >
        etendre d'abord RUNTIME_REGISTRY aux 15 constantes critiques dont
        l'import est sans effet de bord, puis decider sur mesure complete —
        RETENUE COMME PROCHAINE ETAPE DE MESURE, pas comme decision
      - "rendre les 15 paresseuses d'un coup — refuse : deplace des KPI en masse"
      - >
        garantir l'ordre au demarrage (load_dotenv avant tout import applicatif)
        plutot que changer les constantes : ne deplace aucun KPI en regime normal
        mais reste une modification d'amorcage, donc a instruire
    blocked_by: "INV-4 + couverture de mesure insuffisante (3/234)"

  - id: DEC-HORIZON-001
    question: >
      L'horizon de detention doit-il etre aligne sur l'horizon d'information du
      score (12-24 h) plutot que sur le TIMEOUT de 8 h et le SL actuels ?
    authority: "OPERATEUR — modifie une regle de sortie, donc un seuil. ADR requis."
    status: EN_ATTENTE
    raised: "2026-07-29"
    raised_by: "AUDIT-EMP-002"
    measured_on: "regret v2 N=18716 + trades canoniques N=121, snapshot VPS 2026-07-29"
    observations:
      - "rho(score, rendement) : 0.017 a 1h, 0.072 a 4h, 0.154 a 12h, 0.160 a 24h"
      - "duree de detention realisee : 5.92 h en moyenne ; TIMEOUT 62/121, SL 51/121"
      - "edge brut realise -0.4671 % contre friction 0.1942 % (INV-FRICTION-001)"
      - "rho a 24h absent en regime sideways (-0.054), ou le marche passe l'essentiel du temps"
    why_it_matters: >
      Si H-HORIZON est vraie, le systeme paie une friction de 0.1942 % pour
      capter un signal qu'il coupe avant maturation, et aucune optimisation de
      sizing ni de score ne peut compenser. Si elle est fausse, allonger la
      detention augmentera l'exposition sans gain d'esperance.
    why_not_decided_now: >
      Toucher TIMEOUT ou SL est une modification de seuil : interdite avant
      N >= 500 et CRI >= 90 (INV-4), et hors autorite de l'auditeur. Surtout,
      l'hypothese n'est pas encore testee : elle est deduite de deux populations
      DIFFERENTES (candidats bloques d'un cote, trades executes de l'autre), ce
      qui est un rapprochement, pas une mesure.
    alternatives_considered:
      - "ne rien changer et laisser le burn-in accumuler jusqu'a N >= 500"
      - >
        RETENUE COMME EXPERIENCE, PAS COMME DECISION : rejouer les 121 trades
        executes contre le rendement a 12h et 24h de la MEME paire au MEME
        instant, pour mesurer sur une population unique si la detention longue
        aurait change le signe de l'esperance. Aucune modification du moteur ;
        outil de mesure, donc autorise sous gel.
      - "aligner TIMEOUT sur 24h — interdit sans ADR et sans l'experience ci-dessus"
    blocked_by: "INV-4 (N >= 500, CRI >= 90) + experience de rejeu non encore faite"
    note_statistique: >
      L'IC95 par blocs de jours sur rho a 24h est [+0.025 ; +0.304] avec 11 jours
      seulement. Le signe est etabli, la TAILLE de l'effet ne l'est pas. Une
      decision de sortie calibree sur rho=0.16 supposerait une precision que la
      mesure n'a pas.

  - id: DEC-PROTO-001
    question: "Echelle de dette : reconcilier trois echelles divergentes"
    authority: "mainteneur documentaire"
    status: PRISE
    date: "2026-07-27"
    alternatives_considered:
      - "conserver deux echelles distinctes (doc vs implementation)"
      - "supprimer 'nulle' (aligner sur la specification operateur)"
      - "supprimer 'moyenne' (aligner sur le document canonique)"
      - "UNION des deux — RETENUE"
    justification: >
      Supprimer un niveau aurait invalide des classifications existantes :
      'nulle' est utilise pour qualifier une dette relative a une decision non
      concernee ; 'moyenne' est utilise par UNK-005. L'union preserve les deux
      usages sans reclassement retroactif.
    consequences: >
      Cinq niveaux au lieu de quatre. Risque : 'nulle' et 'mineure' peuvent
      etre difficiles a distinguer en pratique.
    reversibility: >
      REVERSIBLE. Supprimer un niveau exige de reclasser les entrees
      concernees — coute quelques minutes, aucune donnee perdue.
    falsifier: >
      Un cas ou 'nulle' et 'mineure' ne se distinguent pas, montrant que
      l'union a cree un niveau inutile.
    irreversible: false

