    name: "Socle documentaire"
    reversible: true
    reached: true
    requires_tickets: []
    authority: "aucune"
    exit_criteria:
      - "Diagnostic valide et ecrit"
      - "Regles ecrites"
      - "Roadmap et backlog generes"
      - "Prompts des tickets non gated rediges"
  - id: L1
    name: "Gouvernance etablie"
    reversible: true
    reached: false
    requires_tickets: [GOV-001, GOV-002, GOV-003, GOV-004, GOV-005]
    authority: "session Claude ; D-3 = operateur"
    exit_criteria:
      - "Chaque invariant possede un test de violation executable"
      - "Checklist de deploiement operationnelle"
  - id: L2
    name: "Observabilite honnete"
    reversible: true
    reached: false
    requires_tickets: [OBS-001, OBS-002, OBS-003, OBS-004, REST-001, REST-002, REST-003, REST-004]
    authority: "session Claude"
    exit_criteria:
      - "Exposition affichee > 0 avec positions ouvertes"
      - "paper_cash et free_cash coherents"
      - "Verdict de check_new_trade strictement inchange"
      - "git diff sur portfolio_brain.py:88-109 vide"
  - id: L3
    name: "Decision d'epoque prise"
    reversible: false
    reached: false
    requires_tickets: [PORT-001]
    authority: "operateur seul"
    exit_criteria:
