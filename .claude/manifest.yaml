# -----------------------------------------------------------------------------
# DETTE EPISTEMIQUE RESIDUELLE — les INCONNUES comme objets gouvernes
#
# Ne pas confondre avec deferred_maintenance (des anomalies CONNUES qu'on
# choisit de ne pas corriger). Ici : ce qu'on NE SAIT PAS, et qui pourrait
# invalider une conclusion.
#
# Une inconnue mentionnee dans un texte n'est pas gouvernee. Une inconnue avec
# un id, une dette, une decision bloquee et un moyen de l'observer, l'est.
#
# TROIS NOTIONS DISTINCTES, a ne jamais confondre :
#
#   UNKNOWN     - une observation MANQUE, mais elle est en principe observable
#                 avec l'instrumentation existante. Action : aller observer.
#
#   BLIND_SPOT  - l'observation est ACTUELLEMENT IMPOSSIBLE : aucun instrument
#                 ne la produit. Action : construire l'instrument D'ABORD.
#                 Le cout et la nature de l'action sont differents.
#
#   dette       - l'EFFET de cette absence sur une DECISION donnee. Ce n'est
#                 pas une propriete de l'inconnue, mais de la RELATION entre
#                 l'inconnue et la decision. Une meme inconnue peut etre
#                 critique pour une decision et nulle pour une autre.
#
# NIVEAUX DE DETTE - definitions NORMATIVES, pas intuitives :
#   critique : empeche une decision IRREVERSIBLE
#   majeure  : empeche la validation d'un objectif de campagne,
#              mais pas une decision reversible
#   moyenne  : reduit significativement la confiance sans bloquer la decision
#   mineure  : affecte seulement la precision ou la comprehension
#
# CYCLE DE VIE — construire l'instrument NE RESOUT PAS l'angle mort.
# Cela cree seulement la POSSIBILITE d'observer. L'etat intermediaire est
# explicite pour empecher le glissement "j'ai construit le test" -> "je sais".
#
#   BLIND_SPOT / NON_OBSERVABLE
#         | construire l'instrument
#         v
#   BLIND_SPOT / OBSERVABLE        <- l'instrument existe, RIEN n'est encore observe
#         | reclassement (l'angle mort a disparu, l'inconnue demeure)
#         v
#   UNKNOWN / NON_OBSERVE
#         | produire l'observation
#         v
#   UNKNOWN / OBSERVE              = LEVEE
#
# status admis : BLIND_SPOT -> NON_OBSERVABLE | OBSERVABLE
#                UNKNOWN    -> NON_OBSERVE    | OBSERVE
#
# DETTE CRITIQUE : doit etre DEMONTREE, jamais declaree. Une dette critique
# affirme qu'une decision IRREVERSIBLE est bloquee ; cette irreversibilite
# exige sa propre justification et son propre falsificateur.
#   critical_justification:
#     decision: <id>
#     why_irreversible: <...>
#     falsifier: "montrer que la decision est reversible"
#
# Chaque entree repond a :
#   kind                : UNKNOWN | BLIND_SPOT
#   what_is_missing / why_it_matters / blocks / how_to_observe / debt / status
#   instrument_required : (BLIND_SPOT uniquement) l'instrument a construire
#   critical_justification : (debt critique uniquement)
# -----------------------------------------------------------------------------
residual_epistemic_debt:

  - id: UNK-001
    kind: BLIND_SPOT
    what_is_missing: >
      RUPTURE DE CHAINE D'OBSERVATION : le pipeline builder -> renderer ->
      Telegram n'a JAMAIS ete observe dans son integralite, par aucun test.
      Ce n'est pas une observation qu'on a omis de faire : c'est une
      observation qu'AUCUN instrument existant ne peut produire, puisque
      core/advisor_loop.py n'est pas importable (import plat ligne 33).
    why_it_matters: >
      Le ticket existe pour que l'operateur voie des chiffres justes. Des tests
      verts ne demontrent pas que le panneau affiche effectivement une
      exposition non nulle : advisor_loop n'est pas importable, donc le chemin
      complet builder -> renderer -> Telegram n'est couvert par aucun test.
    blocks: "cloture reelle de OBS-002, OBS-003, OBS-005 (au-dela du merge)"
    how_to_observe: >
      Impossible en l'etat. Deux voies : (a) observation manuelle apres
      deploiement - ponctuelle, non reproductible, ne ferme PAS l'angle mort ;
      (b) construire l'instrument (voir instrument_required).
    instrument_required: >
      Un test d'integration couvrant builder -> renderer, ce qui suppose de
      rendre core/advisor_loop.py importable ou d'en extraire le builder.
      NON PLANIFIE - echoue a INV-ROI-001 en l'etat. A reconsiderer si un
      defaut d'affichage se reproduit.
    debt: majeure
    status: NON_OBSERVABLE

  - id: UNK-002
    kind: UNKNOWN
    what_is_missing: >
