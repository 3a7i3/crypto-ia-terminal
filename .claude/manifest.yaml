    - id: AUDIT-TRANSFORMATION-001
      question: "toute agregation documente-t-elle sa perte d'information ?"
      instrument: >
        tools/experiment_quality_audit.py (critere TRANSFORMATION, precision
        corrigee) + tools/chain_audit.py (4 controles par arete) +
        system/provenance.py (empreintes verifiables)
      measured: >
        2026-07-29 : 8 PASS / 4 FAIL — mesure INVALIDEE le 2026-07-30.
        2026-07-30 apres correction : 1 PASS / 0 FAIL / 2 INVALIDE / 17 non liant.
        Chaine : 1 arete d'artefact sur 2 intacte (l'autre absente en local).
      status: TRAITE_PARTIELLEMENT
      correction: >
        Les 4 FAIL du 2026-07-29 etaient 3 FAUX POSITIFS et 1 propagation. Le
        motif `json\\.dump` sans parenthese capturait `json.dumps` : exit_audit,
        exit_replay et validate_trade_dataset n'ecrivent AUCUN fichier, ils
        impriment sur stdout. La famille designee prioritaire etait surevaluee
        de 300 %. Verifier avant de corriger a economise trois chantiers inutiles.
      remaining: >
        La perte d'information au sens du § 20 (une moyenne qui masque une
        bimodalite) n'est toujours pas detectable par balayage lexical — seul le
        couple date + population l'est, plus les empreintes si le producteur les
