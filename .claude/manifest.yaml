          SANS AUCUNE EMPREINTE.
        - >
          O7 DEUX DEFAUTS MAJEURS sur l'axe ADOPTION lui-meme : une simple
          MENTION de attach_proof (docstring, commentaire, ou phrase qui NIE
          l'usage) suffisait a obtenir PASS ; et la branche d'echec « bloc
          fabrique a la main » etait masquee par toute mention de l'API.
        - >
          O8 Huit defauts mineurs corriges : denominateur minuscule donnant un
          plafond eleve (1/1 = 100 %), compteur incoherent (measured > total)
          rendant le plafond MAXIMUM, propagation NON idempotente detruisant
          original_reason, plafond NON monotone (declarer moins donnait un
          meilleur plafond), instrument absent du disque compte comme « sans
          defaillance », auto-verification tautologique et sautee en --quiet,
          chemins d'entree resolus contre le cwd, portee d'une preuve sur JSONL
          non declaree.

      falsifier_tested: >
        POSE AVANT LA MESURE : si la verification adversariale ne trouve aucun
        defaut demontre, elle ne mesure rien et son cout n'est pas justifie.
      falsifier_outcome: NON_REFUTE
      falsifier_detail: >
        1 critique, 3 majeurs et 8 mineurs corriges, tous accompagnes d'une
        reproduction executee par leur auteur. La livraison initiale aurait donc
        publie un mecanisme de preuve capable de CERTIFIER un contenu qu'il ne
        verifiait pas — exactement l'inverse de son objet.

      what_the_protocol_caught: >
        La discipline « verifier avant de corriger » a de nouveau paye : la
        premiere lentille a demontre que le mecanisme livre la veille au soir
        certifiait des artefacts non verifies. Sans passe adversariale, le defaut
        aurait ete decouvert par un consommateur, c'est-a-dire trop tard.

      what_the_protocol_missed:
        - >
          ADOPTION n'est pas EFFICACITE (nouvelle famille). L'axe mesurait
          « 1/1 = 100 % d'artefacts prouves » sur un mecanisme qui, a ce
          moment-la, ne prouvait rien. Un taux d'adoption eleve d'un mecanisme
          casse est PIRE qu'une adoption nulle : il produit une fausse assurance.
          Aucune regle n'exige aujourd'hui de valider qu'un mecanisme FONCTIONNE
          avant de mesurer sa diffusion.
        - >
          AUTO-VERIFICATION : le producteur verifiait l'objet qu'il venait de
          construire EN MEMOIRE — tautologique. Corrige (relecture du fichier),
          mais rien dans le protocole n'interdisait la tautologie.
        - >
          La campagne adversariale a ete interrompue : aucune etape de refutation
          n'a valide les constats, et l'auteur des corrections est aussi celui qui
          juge de leur suffisance. Dette epistemique assumee.

      cost: >
        Une passe adversariale interrompue, 12 defauts corriges, 30 tests de
        non-regression. Aucune ligne du moteur de trading modifiee.

      outcome:
        - "INV-PROOF-001 (constructeur unique) et INV-ADOPTION-001 formes."
        - "Protocole v4.3 : § 23 ADOPTION + § 23.1 deux (puis trois) plafonds."
        - "AUDIT-ADOPTION-001 enregistre comme axe PERMANENT."
        - "Boucle de preuve demontree de bout en bout sur 1 producteur sur 3."
        - >
          Reste ouvert : ADOPTION vs EFFICACITE non instrumente ; 2 producteurs
          non adoptes (choix delibere) ; terminaison non persistee des 4 chaines,
          donc « quelle preuve soutenait cette decision ? » reste sans reponse
          automatique.
        - "SOLDE le 2026-07-30 par AUDIT-EMP-006 : les trois points ci-dessus."

    - id: AUDIT-EMP-006
      date: "2026-07-30"
      nature: METHODOLOGIE
      trigger: >
        Constat de l'operateur apres AUDIT-EMP-005 : (a) la campagne adversariale
        n'est plus un test mais un INSTRUMENT DE DECOUVERTE ; (b) le defaut
        « ADOPTION sur mecanisme casse » n'appartient a aucun des cinq axes — c'est
        une SIXIEME famille, la VALIDITE ; (c) « mention vs usage » compte trois
        occurrences et merite une regle transversale ; (d) le constructeur unique
        ouvre un point d'instrumentation ; (e) la persistance des decisions reste
        le maillon manquant ; (f) plusieurs indicateurs verts peuvent reposer sur
        un composant commun casse — dependance a modeliser explicitement.
      scope: >
        system/provenance.py (self_test, proof_id, min_compatible_version),
        tools/chain_audit.py (statut MECANISME_INVALIDE, arete de decision),
        tools/experiment_quality_audit.py (calls_function par AST, axe VALIDITY),
        scripts/prelive_gate.py (decision persistee et prouvee).

      observations:
        - >
          O1 VALIDITE instrumentee : auto-test de 9 cas dont SEPT NEGATIFS
          (corps falsifie, empreinte retiree, bloc forge, entree modifiee, outil
          modifie, artefact substitue). Resultat au 2026-07-30 : VALIDE 9/9.
        - >
          O2 Le test du test est execute : neutraliser verify_provenance FAIT
          tomber l'auto-test (PROV-16). Un auto-test complaisant serait passe.
        - >
          O3 DEPENDANCE MODELISEE : un mecanisme invalide rend desormais
          MECANISME_INVALIDE sur tous les controles PREUVE, invalide l'axe
          ADOPTION, et force les trois plafonds a AUCUNE. Verifie par injection
          (PROV-18, QUAL-16).
        - >
          O4 INV-LEXICAL-001 : la detection d'usage passe de l'expression
          reguliere a l'ARBRE SYNTAXIQUE. Une mention en docstring, un
          commentaire ou une chaine de caracteres ne comptent plus comme un
          appel ; repli textuel autorise si le fichier ne parse pas, mais DECLARE.
        - >
          O5 DECISION PERSISTEE : scripts/prelive_gate.py ecrit
          cache/decisions/prelive_gate.json + un journal en append. La preuve de
          la decision EPINGLE l'empreinte du rapport de burn-in qui l'a soutenue.
          CHAIN-BURNIN-PRELIVE a desormais une terminaison persistee et un plafond
          COMPLETE.
        - >
          O6 ADOPTION passe de 1/3 a 2/3 au niveau code (burnin + prelive) et
          2/2 au niveau artefact present. Le precedent complet exige par
          l'operateur a bien precede l'extension.
        - >
          O7 POINT UNIQUE D'INSTRUMENTATION : `proof_id` deterministe et
          `min_compatible_version` ajoutes dans create_proof et NULLE PART
          ailleurs. Une evolution du format ne touchera aucun producteur.

      falsifier_tested: >
        POSE AVANT LA MESURE : si neutraliser verify_provenance ne fait pas
        tomber l'auto-test, celui-ci ne teste que sa propre complaisance et
        l'invariant VALIDITY est decoratif.
      falsifier_outcome: NON_REFUTE
      falsifier_detail: >
        L'injection fait tomber l'auto-test, fait apparaitre MECANISME_INVALIDE
        sur les aretes, invalide l'axe ADOPTION et ramene le plafond a AUCUNE.
        Les quatre consequences sont verifiees par test.

      what_the_protocol_caught: >
        L'ordre d'evaluation. VALIDITE est desormais evaluee AVANT adoption, et
        non l'inverse : mesurer la diffusion d'un mecanisme dont on n'a pas
        montre qu'il fonctionne produit une fausse assurance. Sans cet ordre, le
        rapport du 2026-07-30 aurait continue d'afficher 1/1 = 100 %.

      what_the_protocol_missed:
        - >
          COUVERTURE DE L'AXE VALIDITY : un seul mecanisme est auto-teste, celui
          de la preuve. Les 20 instruments du depot n'ont AUCUN cas negatif qui
          montrerait qu'ils detectent ce qu'ils pretendent detecter. L'axe est
          cree avec une couverture de 1/20 — et le dit.
        - >
          La campagne adversariale n'a PAS de statut d'instrument : pas de
          couverture declaree, pas de puissance, pas de limites ecrites. Elle
          produit pourtant des observations (12 defauts en une passe). Demande
          explicite de l'operateur, non traitee dans cette passe.

      cost: >
        Un auto-test, un detecteur syntaxique, une persistance de decision,
        27 tests. Aucune ligne du moteur de trading modifiee.

      outcome:
        - "INV-VALIDITY-001 et INV-LEXICAL-001 formes."
        - "AUDIT-VALIDITY-001 enregistre comme axe PERMANENT (couverture 1/20)."
        - "Protocole v4.4 : § 24 VALIDITE, § 24.1 dependance modelisee, § 24.2 usage != mention, § 24.3 decision de premiere classe."
        - "La question « quelle preuve soutenait cette decision ? » a une reponse automatique."
        - >
          Reste ouvert : statut d'instrument pour la campagne adversariale ;
          couverture de l'axe VALIDITY (1 mecanisme sur 20) ; 3 chaines sur 4
          restent a terminaison non persistee.

