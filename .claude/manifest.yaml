  linked_unknown: UNK-006

  # ---------------------------------------------------------------------------
  # AXES DE QUALITE DES EXPERIENCES (proposes par l'operateur le 2026-07-29)
  #
  # Le protocole v4 sert desormais a auditer les EXPERIENCES STATISTIQUES et pas
  # seulement le code. Les quatre axes ci-dessous ont ete mesures en une passe
  # par AUDIT-EMP-003 ; la mesure automatique ne vaut PAS verification humaine.
  # ---------------------------------------------------------------------------
  experiment_quality_axes:
    - id: AUDIT-POWER-001
      question: "toute analyse publie-t-elle son effet minimal detectable ?"
      instrument: "tools/experiment_quality_audit.py — critere POWER"
      measured: "2026-07-29 : 3 PASS / 7 FAIL / 9 non liant sur 19 instruments"
      status: MESURE_AUTOMATIQUE_FAITE
      remaining: >
        7 instruments a instruire un par un. Une puissance publiee n'est pas une
        puissance CORRECTE : l'outil ne verifie que la declaration.
      invariant: INV-POWER-001

    - id: AUDIT-POPULATION-001
      question: "toute comparaison dit-elle si les deux populations sont identiques ?"
      instrument: "tools/experiment_quality_audit.py — critere POPULATION"
      measured: "2026-07-29 : 9 PASS / 7 FAIL / 3 non liant"
      status: MESURE_AUTOMATIQUE_FAITE
      remaining: >
        Le critere verifie l'usage du loader canonique, PAS la declaration d'une
        comparaison entre deux populations differentes. Ce second cas releve du
        type de transformation PROJECTION (protocole v4.1 § 20.1) et n'a AUCUN
