# =============================================================================
# manifest.yaml — SOURCE DE VERITE UNIQUE du chantier de remediation SSoT
# =============================================================================
#
# Ce fichier est la SEULE chose qu'on edite a la main.
# INDEX.md, IMPLEMENTATION_QUEUE.md et les blocs d'etat de MASTER_ROADMAP.md /
# CHECKPOINTS.md en sont des VUES GENEREES :
#
#     python .claude/tools/render_docs.py
#
# Ne jamais editer a la main un fichier portant le marqueur GENERATED.
# En cas de divergence, la hierarchie de verite est :
#     git log  >  manifest.yaml  >  documents generes
#
# =============================================================================

meta:
  version: "1.0"
  updated: "2026-07-24"
  authority: "operateur (Mathieu)"
  renderer: ".claude/tools/render_docs.py"

project:
  name: crypto_ai_terminal
  chantier: "Remediation de la dette Single Source of Truth"
  problem: >
    Le panneau Telegram affiche simultanement "Positions: 3" et
    "Portfolio Exposure: 0.0%". Audit SSoT : 0 PASS / 1 WARNING / 8 FAIL.
  root_cause: >
    core/advisor_loop.py:6786 passe pos_manager.get_open() a portfolio_health(),
    or pos_manager est vide en mode paper : les positions vivent dans
    _virtual_portfolio (MexcSimulator). portfolio_brain.py:668-687 itere une
    liste vide => exposition 0.
  proof: "free_cash = 674.47 x 0.40 - 0 = 269.79 $, exactement la valeur affichee"
  hidden_consequence: >
    Les cinq controles de check_new_trade (portfolio_brain.py:121-190) s'executent
    sur un portefeuille percu comme vide : le gate est trop permissif.

# -----------------------------------------------------------------------------
# INVARIANTS — non negociables
# -----------------------------------------------------------------------------
invariants:
  - id: INV-1
    statement: "Passivite absolue des observers (ADR-0007)"
    violation: "Un composant d'observabilite influence une decision en temps reel"
  - id: INV-2
    statement: "Aucun reset de N sans ADR d'epoque signe par l'operateur"
    violation: "Modifier ce que le moteur REGARDE"
  - id: INV-3
    statement: "paper_trades.jsonl ecrit uniquement par mexc_simulator.py et recorder.py"
    violation: "Ecrire ou reecrire l'historique"
  - id: INV-4
    statement: "Aucun seuil modifie avant N >= 500 et CRI >= 90"
    violation: "Toucher une constante de seuil (portfolio_brain.py:88-109)"
  - id: INV-DATASET-001
    statement: >
      Toute decision utilisant les paper trades documente explicitement le
      loader qui a produit sa population. Un seul loader canonique :
      tools/cri_calculator.py::load_clean_trades. Si deux outils calculent le
      meme KPI a partir de populations differentes, la decision est PLAFONNEE
      — elle ne peut pas etre accordee, seulement refusee ou suspendue.
    violation: >
      Reconstruire un filtre de dataset hors du loader canonique ; citer un N
      sans provenance ; comparer deux KPI issus de populations differentes.
    formed_from: >
      INCIDENT CONSTATE le 2026-07-28, au franchissement du gate N>=100. Trois
      outils lisaient trois populations du meme fichier : cri_calculator 106
      CLOSE (borne d'epoque appliquee), burnin_calibration_v3 631 (filtres
      qualite, pas de borne), prelive_gate 649 (aucun filtre). Le verdict en
      dependait : burn-in rendait NO_GO sur 631 a cause d'un drawdown de
      33.55 % herite des epoques mortes, et DEGRADED (0.86 %) sur les 106
      canoniques. Regle ecrite APRES l'incident, jamais avant.
    enforced_by:
      - "tests/test_dataset_loader_alignment.py (ALIGN-01..07, 10 tests)"
      - "tools/cri_calculator.py::trades_provenance — population reconstituable"
      - "prelive_gate.gate_d_calibration — refuse une population divergente"
    scope_note: >
      Les filtres de qualite qui n'existaient que dans burnin_calibration_v3
      (fixtures de test, artefacts de restauration) ont ete absorbes par le
      loader canonique. Impact mesure a l'absorption sur le corpus du
      2026-07-28 : 0 exclusion post-borne V4, CRI inchange a 43.27. Aucune
      information perdue par l'unification.

  - id: INV-METRIC-001
    statement: >
      Un KPI porte le nom de sa FORMULE, et cette formule est ecrite une seule
      fois dans le depot (system/performance_metrics.py). Un rapport qui cite
      un KPI nomme cite aussi la variante utilisee. Changer la variante lue par
      une gate DEPLACE son seuil : c'est une decision d'operateur, pas un
      nettoyage de code.
    violation: >
      Reecrire une formule de KPI hors de system/performance_metrics.py ;
      publier un "Sharpe" sans nommer sa variante ; changer la variante lue par
      une gate sans ADR signe.
    formed_from: >
      INCIDENT CONSTATE le 2026-07-28 (AUDIT-EMP-001), quantifie le 2026-07-29
      (AUDIT-EMP-002) : quatre formules coexistaient sous le mot "Sharpe" et
      deux conventions sous "win rate". Sur la MEME population canonique
      (N=121) elles rendaient -0.1015 (gate B), -1.61 (burn-in), -1.574 (t de
      Student sur pnl_usd) et -1.112 (t sur pnl_pct). Regle ecrite APRES la
      mesure, jamais avant.
    enforced_by:
      - "tests/test_performance_metrics.py (METRIC-01..06, 22 tests)"
      - "METRIC-02 verrouille bit-a-bit les formules historiques des 2 gates"
      - "SHARPE_VARIANTS : les 4 variantes nommees, exposees cote a cote"
    scope_note: >
      Le refactor du 2026-07-29 ne tranche AUCUNE des quatre definitions :
      burnin conserve annualized_252_ddof0, la gate B conserve per_trade_ddof0.
      Valeurs identiques avant/apres, verifiees sur le dataset canonique.
      DEC-SHARPE-001 reste EN_ATTENTE.

  - id: INV-FRICTION-001
    statement: >
      Tout modele dont l'edge BRUT moyen par trade est inferieur a son cout de
      friction total est condamne a une esperance negative, quel que soit le
      money management. La comparaison est independante de l'architecture : ni
      la taille de position, ni le sizing Kelly, ni le nombre de positions
      simultanees, ni la courbe d'equity n'y entrent.
    violation: >
      Justifier une optimisation de sizing, de portefeuille ou de sortie alors
      que marge = edge_brut - friction <= 0 ; presenter une amelioration de PnL
      obtenue par changement de taille comme une amelioration d'edge.
    formed_from: >
      MESURE du 2026-07-29 sur le dataset canonique V4 (N=121, taille fixe a
      10.00 USD sur les 121 trades) : friction = 0.1942 % par trade, reconstruite
      par difference (size x pnl_pct - pnl_usd) sans lire aucune config de frais ;
      edge brut moyen = -0.4671 % ; marge = -0.6613 %. Verdict
      PLANCHER_NON_FRANCHI. Le plancher d'edge est donc de 0.1942 % et le systeme
      est 0.66 point en dessous.
    enforced_by:
      - "system/performance_metrics.py::friction_floor"
      - "tests/test_performance_metrics.py METRIC-05/06 (dont le test d'independance a la taille)"
      - "tools/score_calibration_audit.py — rapporte le plancher en tete de rapport"
    scope_note: >
      L'invariant ne dit pas OU chercher l'edge. Il dit que seuls deux leviers
      peuvent franchir le plancher : l'entree (edge brut) ou le cout d'execution.
      Toute autre optimisation est, sous plancher non franchi, arithmetiquement
      inoperante.

  - id: INV-POWER-001
    statement: >
      Toute conclusion d'ABSENCE d'effet est PLAFONNEE tant que l'effet minimal
      detectable n'est pas publie. La puissance se lit AVANT la significativite :
      un p > 0.05 obtenu par un instrument incapable de voir l'effet cherche
      n'est pas une information sur le systeme, c'est une information sur
      l'instrument. Une exigence de VOLUME (N >= 500) ne vaut pas une puissance.
    violation: >
      Ecrire "pas d'effet", "pas d'edge", "non significatif donc nul" sans
      publier l'effet minimal detectable ; presenter un seuil de N comme une
      garantie de detection ; comparer une statistique a un seuil sans dire ce
      que l'instrument pourrait voir.
    formed_from: >
      MESURE du 2026-07-29, sur inventaire complet et non sur un incident isole.
      Instance declenchante : Pearson r ~ 0.003 sur N=109 lu comme "le score
      n'informe pas", alors que 45 % des observations partageaient un seul score,
      la bande utile couvrait 13 % de l'echelle et |rho| minimal detectable
      valait 0.252 — aucun effet plausible n'y etait visible. Puis
      tools/experiment_quality_audit.py a inventorie 19 instruments : SEPT
      concluent sans publier d'effet minimal detectable, dont
      tools/cri_calculator.py qui publie quatre exigences de VOLUME (N_TARGET,
      MIN_CELL_OBSERVATIONS, MIN_PSI_SAMPLE, balance) et aucune puissance. La
      regle de formation du protocole est donc satisfaite : sept instances
      mesurees dans une passe, pas une anecdote.
    enforced_by:
      - "tools/experiment_quality_audit.py — critere POWER, preuve citable a la ligne"
      - "tests/test_experiment_quality_audit.py QUAL-05 (dont volume != puissance)"
      - "tools/score_calibration_audit.py::min_detectable_rho + verdict INSTRUMENT_INSUFFISANT"
      - "tests/test_score_calibration_audit.py SCORE-05 : puissance testee AVANT significativite"
    scope_note: >
      Un verdict DETERMINISTE (comparaison exacte, aucun echantillon) ne lie pas
      cet invariant, a condition de le declarer. tools/init_order_audit.py le
      declare : "unite d'echantillonnage : aucune". La declaration est
      falsifiable — un verdict declare deterministe qui repose en fait sur un
      echantillon est une fausse declaration.

  - id: INV-INIT-001
    statement: >
      Categorie INIT-ORDER, distincte du dataset et des KPI. L'ordre est
      .env -> load_dotenv() -> imports dependants. Toute constante de CAPITAL,
      de RISQUE ou d'EXECUTION lue a la racine d'un module doit etre prouvee
      non dependante de l'ordre d'import, ou declaree comme l'etant.
    violation: >
      Ajouter une constante de module lue via os.getenv qui gouverne le capital,
      le risque ou l'execution, sans differentiel empirique ; conclure sur un KPI
      dependant d'une telle constante sans verifier l'ordre d'initialisation.
    formed_from: >
      MESURE du 2026-07-29 (tools/init_order_audit.py). Inventaire statique :
      234 constantes lues a l'import via os.getenv, dans 74 fichiers, dont 15
      classees CAPITAL / RISQUE / EXECUTION (_PAPER_CAPITAL, _MAX_TOTAL_EXPOSURE
      par etat de risque, _SIZE_FACTORS de conviction, _MAX_ORDER_P2,
      MAX_DRAWDOWN_HARD, _MAX_POSITION_USD, _SLIPPAGE...). Le motif est donc une
      PROPRIETE du processus, pas un accident. Materialisation PROUVEE une fois,
      par differentiel en sous-processus : infra/wallet_sync.py:48
      _PAPER_CAPITAL = 100.0 sans .env, 1000.0 avec — drawdown des 121 trades
      canoniques a 9.42 % ou 0.95 % selon l'ordre, face au seuil de gate de 10 %.
    enforced_by:
      - "tools/init_order_audit.py (inventaire AST + differentiel en sous-processus)"
      - "tests/test_init_order_audit.py INIT-01..06 (13 tests)"
      - "INIT-05 : egalite sans variable definie = NON_CONTRAINT, jamais STABLE"
    scope_note: >
      DETTE EPISTEMIQUE RESIDUELLE ASSUMEE : 3 constantes sur 234 sont mesurees
      empiriquement (registre RUNTIME_REGISTRY). Les 231 autres ne sont
      qu'inventoriees. Un module qui demarre une boucle ou ouvre un socket a
      l'import ne peut pas etre sonde sans effet de bord — c'est la raison du
      registre explicite, et la raison pour laquelle cet invariant ne peut PAS
      etre declare verifie sur l'ensemble du depot.
      L'outil ne corrige rien : rendre une constante paresseuse deplacerait un
      KPI face a un seuil de gate (DEC-INIT-001).

  - id: INV-COVERAGE-001
    statement: >
      Toute COUVERTURE publiee porte son PLAFOND DE CONFIANCE mecanique
      (system/provenance.py::Coverage). Un rapport plus affirmatif que son
      plafond contredit ses propres donnees. Le plafond d'un ensemble est le
      MAILLON FAIBLE de ses composants — la propagation vaut aussi entre criteres
      d'audit, pas seulement entre observations.
    violation: >
      Publier un ratio de couverture sans plafond ; ecrire "verifie" alors que le
      plafond est FAIBLE ; afficher un critere PASS alors qu'un critere amont dont
      il depend est FAIL (il doit devenir INVALIDE, pas rester PASS).
    formed_from: >
      DEUX instances PREEXISTANTES constatees le 2026-07-30 : la composante
      `coverage` du CRI (32.0/100) et `coverage_pct` du rapport de burn-in etaient
      publiees comme des scores, sans qu'aucune consequence n'en soit tiree sur le
      niveau de langage admissible. Une troisieme instance a ete produite la
      veille par l'auditeur lui-meme : "3 constantes mesurees sur 234" releguee en
      note de bas de page d'INV-INIT-001. Le lecteur devait faire la division et
      en deduire seul les consequences.
    enforced_by:
      - "system/provenance.py::Coverage.confidence_ceiling (grille exposee, discutable)"
      - "system/provenance.py::weakest_ceiling (maillon faible)"
      - "tools/experiment_quality_audit.py — statut INVALIDE par propagation + plafond du rapport"
      - "tools/chain_audit.py — plafond par chaine et plafond global"
      - "tests/test_provenance_and_chain.py PROV-04/05, tests QUAL-09/10 (propagation)"
    scope_note: >
      La grille de seuils (10 % / 50 % / 90 %) est arbitraire et ECRITE dans le
      module pour rester critiquable d'un coup d'oeil. Elle ne gouverne AUCUN
      parametre du moteur : elle borne un niveau de langage dans un rapport.
      Un plafond n'est pas une mesure de qualite — c'est un maximum.

  - id: INV-PROOF-001
    statement: >
      Un bloc de preuve (`proof`) est construit par UN SEUL constructeur :
      system/provenance.py::create_proof, via son point d'entree attach_proof.
      Aucun producteur ne fabrique ce dictionnaire a la main, et l'empreinte de
      sortie exclut toujours le bloc lui-meme (sinon l'artefact serait
      auto-referentiel, donc inverifiable).
    violation: >
      Ecrire `payload["proof"] = {...}` ou dupliquer la logique d'empreinte hors
      de system/provenance.py ; calculer output_sha256 sur un corps incluant la
      preuve.
    formed_from: >
      EXTRAPOLATION ASSUMEE, et enoncee comme telle. La derive de blocs `proof`
      n'a JAMAIS ete observee : il n'en existait aucun avant le 2026-07-30. Ce
      qui est demontre, c'est la propriete de CLASSE dont ce cas releve : dans ce
      depot, la meme structure dupliquee a derive DEUX fois — trois loaders de
      dataset rendant trois populations (INV-DATASET-001) et quatre formules sous
      le nom "Sharpe" (INV-METRIC-001). L'invariant applique une propriete
      etablie a une structure neuve ; il n'est pas tire d'un incident sur cette
      structure.
    enforced_by:
      - "tools/experiment_quality_audit.py — critere ADOPTION, contre-motif _RE_PROOF_MANUAL"
      - "tests/test_experiment_quality_audit.py QUAL-12 (bloc fabrique a la main = FAIL)"
      - "tests/test_provenance_and_chain.py PROV-06 (l'empreinte exclut la preuve, idempotence)"
    scope_note: >
      Le controle est LEXICAL : un producteur qui mentionne attach_proof dans un
      commentaire sans l'appeler passe. Meme famille de limite que POLARITE et
      MENTION-vs-USAGE, deja documentee sur cet outil. L'invariant reste utile
      parce que le contournement demande une intention, pas une distraction.

  - id: INV-ADOPTION-001
    statement: >
      Tout mecanisme defini par le protocole publie son TAUX D'ADOPTION reel.
      Un mecanisme parfait avec 0 % d'adoption equivaut a son absence. ADOPTION
      est un cinquieme axe INDEPENDANT des quatre autres (population, puissance,
      transformation, independance) : la propagation ne l'atteint pas, car
      "ce producteur passe-t-il par l'API ?" reste une question sensee meme si sa
      population est mauvaise.
    violation: >
      Introduire un mecanisme (primitive, champ obligatoire, convention de
      declaration) sans mesure de sa diffusion ; presenter un mecanisme comme
      "en place" alors que son adoption est nulle.
    formed_from: >
      DEUX instances MESUREES le 2026-07-30. (1) Bloc de preuve : 0 artefact sur
      2 avant ce jour — la primitive existait, personne ne l'appelait. (2) Couche
      TRANSFORMATION du protocole v4.0 (2026-07-27) : les champs
      `information_loss` et `assumptions_introduced` n'apparaissent que dans
      docs/protocole_audit_epistemique.md et .claude/manifest.yaml — ZERO
      declaration dans le code, trois jours apres l'introduction de la couche.
      Deux mecanismes, deux adoptions nulles, aucune regle ne l'ayant signale.
    enforced_by:
      - "system/provenance.py::proof_adoption (couverture de premiere classe)"
      - "tools/experiment_quality_audit.py — critere ADOPTION + denominateur liant"
      - "tools/chain_audit.py — adoption mesuree au niveau ARTEFACT"
      - "tests QUAL-12, PROV-08 (0 % -> plafond AUCUNE)"
    scope_note: >
      Deux mesures d'adoption coexistent et peuvent diverger : au niveau du CODE
      (le producteur a-t-il l'intention de prouver) et au niveau de l'ARTEFACT
      (le fichier sur le disque est-il prouve). Un producteur corrige dont
      l'artefact n'a pas ete regenere passe l'une et echoue l'autre. Les deux
      sont publiees separement, jamais moyennees.
      Etat au 2026-07-30 : 1/3 au niveau code, 1/1 au niveau artefact present.

  - id: INV-LEXICAL-001
    statement: >
      Aucun audit ne peut conclure a un USAGE sur la seule presence d'un
      identifiant lexical. Une question qui porte sur un usage (ce fichier
      APPELLE-t-il X ? LIT-il Y ?) se tranche par analyse syntaxique ; un motif
      textuel ne repond qu'a « le mot est-il present ».
    violation: >
      Ecrire un critere d'audit qui conclut PASS/FAIL sur un usage a partir d'une
      expression reguliere ; presenter une correspondance de motif comme une
      preuve de relation semantique.
    formed_from: >
      TROIS instances de la meme faute, sur le meme outil, en deux jours :
      (1) le motif « json.dump » capturait `json.dumps` — trois instruments
      accuses a tort d'ecrire un artefact alors qu'ils imprimaient (2026-07-29) ;
      (2) `databases/paper_trades.jsonl` nomme dans une declaration de chaine
      compte comme une LECTURE du journal (2026-07-29) ; (3) `attach_proof`
      mentionne dans une docstring — voire dans une phrase qui NIE l'usage —
      donnait ADOPTION=PASS (2026-07-30, trouve par attaque adversariale).
      Trois occurrences ne sont plus un accident : c'est une propriete des
      heuristiques lexicales.
    enforced_by:
      - "tools/experiment_quality_audit.py::calls_function (AST, pas motif)"
      - "tests/test_experiment_quality_audit.py QUAL-15"
      - "repli textuel autorise si le fichier ne parse pas — mais DECLARE dans la preuve"
    scope_note: >
      La parade n'est pas un motif plus fin : c'est de CHANGER D'INSTRUMENT quand
      la question porte sur un usage. Les criteres qui cherchent une DECLARATION
      (unite d'echantillonnage, population consommee) restent lexicaux a dessein :
      ils mesurent une intention ecrite, pas un comportement.

  - id: INV-VALIDITY-001
    statement: >
      SIXIEME famille. Un mecanisme peut etre ADOPTE, EXECUTE et parfaitement
      TRACABLE tout en etant incapable de detecter ce qu'il pretend detecter.
      Tout mecanisme de garantie publie donc le resultat d'un AUTO-TEST comportant
      des cas NEGATIFS, et toute garantie qui en derive est INVALIDE tant que cet
      auto-test n'est pas passe. La dependance est modelisee explicitement :
      create_proof -> verify_provenance -> chain_audit -> adoption.
    violation: >
      Publier un indicateur vert derive d'un mecanisme dont la validite n'est pas
      etablie ; ecrire un auto-test compose uniquement de cas positifs ; mesurer
      l'adoption d'un mecanisme sans avoir montre qu'il fonctionne.
    formed_from: >
      DEUX defauts constates le 2026-07-30, dans le meme mecanisme et dans la
      meme passe adversariale — ce qui est plus faible que deux occurrences
      separees dans le temps, et l'invariant le dit : (1) `output_sha256` absent
      faisait sauter silencieusement le controle du corps, et chain_audit
      certifiait « corps inchange » ; (2) un bloc de preuve forge minimal
      obtenait PREUVE=ok. Pendant ce temps l'axe ADOPTION annoncait
      « 1/1 = 100 % ». Quatre indicateurs verts, une garantie nulle.
    enforced_by:
      - "system/provenance.py::self_test — 9 cas dont 7 NEGATIFS"
      - "tools/chain_audit.py — statut MECANISME_INVALIDE, plafond AUCUNE"
      - "tools/experiment_quality_audit.py — ADOPTION invalide par AUDIT-VALIDITY-001"
      - "tests PROV-16/18, QUAL-16 (dont : casser verify_provenance FAIT tomber l'auto-test)"
    scope_note: >
      Un taux d'adoption eleve d'un mecanisme casse est PIRE qu'une adoption
      nulle : il produit une fausse assurance. C'est la raison pour laquelle
      VALIDITY precede ADOPTION dans l'ordre d'evaluation, et non l'inverse.

  # PAS d'invariant de chaine (INV-CHAIN-*) : la regle de formation du protocole
  # l'interdit. Une seule instance est constatee a ce jour — la gate D
  # (AUDIT-EMP-001). Une occurrence est un accident. tools/chain_audit.py existe
  # comme INSTRUMENT et documente les quatre controles ; si une deuxieme rupture
  # d'arete est constatee, l'invariant sera ecrit a ce moment-la, et pas avant.

# -----------------------------------------------------------------------------
# HEALTH BASELINE — etat de reference REPRODUCTIBLE de la suite de tests
#
# La suite ne s'execute pas avec `pytest tests/ -q` : la collecte est interrompue
# par une erreur d'import PREEXISTANTE. Ce n'est pas un caveat, c'est un etat de
# reference mesure, versionne, et opposable.
#
# expected_collection_errors est un INVARIANT :
#     observe == expected  -> PASS
#     observe >  expected  -> FAIL   (nouvelle dette introduite par le ticket)
#     observe <  expected  -> la dette a diminue : mettre a jour ce bloc
# -----------------------------------------------------------------------------
health_baseline:
  suite_state: DEGRADED
  command: "python -m pytest tests/ -q --continue-on-collection-errors"
  measured_at_commit: "PENDING"
  # Rafraichie le 2026-07-30 apres AUDIT-EMP-006 : +13 tests (PROV-16..18,
  # CHAIN-11, QUAL-15..16). collected 3996 -> 4009, passed 3972 -> 3985, soit
  # exactement +13. Les 3 known_failures et l unique erreur de collecte sont
  # INCHANGES, NOMS verifies un par un.
  #
  # Rafraichie le 2026-07-30 apres AUDIT-EMP-005 : +44 tests (PROV-10..15,
  # CHAIN-10, QUAL-12..14) — dont 30 tests de NON-REGRESSION issus de defauts
  # demontres par verification adversariale. collected 3952 -> 3996, passed
  # 3928 -> 3972, soit exactement +44. Les 3 known_failures et l unique erreur
  # de collecte sont INCHANGES, NOMS verifies un par un.
  #
  # Rafraichie le 2026-07-30 apres AUDIT-EMP-004 : +33 tests (PROV-01..05,
  # CHAIN-01..06, QUAL-09..11). collected 3919 -> 3952, passed 3895 -> 3928,
  # soit exactement +33. Les 3 known_failures et l unique erreur de collecte
  # sont INCHANGES, NOMS verifies un par un.
  #
  # Rafraichie le 2026-07-29 apres AUDIT-EMP-003 : +33 tests (QUAL-01..08 et
  # INIT-01..06). collected 3886 -> 3919, passed 3862 -> 3895, soit exactement
  # +33. Les 3 known_failures et l unique erreur de collecte sont INCHANGES,
  # NOMS verifies un par un.
  #
  # Rafraichie le 2026-07-29 apres AUDIT-EMP-002 : +46 tests (METRIC-01..06 et
  # SCORE-01..09). collected 3840 -> 3886, passed 3816 -> 3862, soit exactement
  # +46 : les 3 known_failures et l unique erreur de collecte etaient INCHANGES.
  # Duree 336 s (355 s au releve precedent) : variance de machine, pas un signal.
  #
  # Rafraichie le 2026-07-28 apres AUDIT-EMP-001 : +11 tests (10 d alignement
  # ALIGN-01..07, 1 net sur le validateur). Les 3 known_failures et l unique
  # erreur de collecte etaient INCHANGES.
  #
  # PIEGE CONSTATE lors de cette mesure : un premier passage lance avec
  # PYTHONIOENCODING=utf-8 a donne 3 echecs dont un HORS baseline
  # (test_monitoring_profiler, mojibake sur la sortie d un subprocess) tandis
  # que test_sqlite_contamination_cleanup passait. Le COMPTE etait conforme, la
  # COMPOSITION non : un echec en avait masque un autre. La regle de derive
  # ci-dessous compare des nombres — elle ne detecte pas une substitution.
  # Toujours relancer avec la commande `command:` exacte, sans variable
  # d environnement ajoutee, et comparer les NOMS.
  previous_baseline:
    measured_at_commit: "fc7fcf6"
    collected: 3996
    passed: 3972
  expected_collection_errors: 1
  known_errors:
    - file: "tests/test_full_integration.py"
      line: 13
      reason: "ModuleNotFoundError: No module named 'tracker_system.exchange.binance_client'"
      preexisting: true
      ticket: null      # aucun ticket de campagne ne le corrige : INV-ROI-001 le refuse
      note: >
        Dette de maintenance, hors campagne. Ne rapproche ni du burn-in ni de la
        validite de la mesure de N. A traiter hors gel, jamais pendant.
  collected: 4009
  passed: 3985
  failed: 3
  skipped: 20
  xfailed: 2
  duration_s: 629
  expected_failures: 3
  known_failures:
    - "tests/paper_trading/test_paper_trade_e2e.py::TestPaperTradeCompleteLifecycle::test_mexc_simulator_market_order_complete"
    - "tests/scripts/test_sqlite_contamination_cleanup.py::test_cleanup_confirm_deletes_and_reaudits"
    - "tests/test_dataset_validator.py::test_validate_log_valid_file"
  collection_errors: 1
  # Regle de derive appliquee par le validateur (voir render_docs.py::check_health) :
  #   collection_errors > expected_collection_errors -> FAIL
  #   failed           > expected_failures           -> FAIL
  #   failed           < expected_failures           -> AMELIORATION a signaler
  known_failures_note: >
    Les 3 echecs sont PREEXISTANTS, mesures au commit 8cb42fb avant toute
    modification de tests/. Le troisieme est revelateur : DatasetValidator
    refuse schema_version=3 (attendu [1, 2]) — incoherence de version de schema
    dans le dataset, a instruire hors campagne (INV-ROI-001).
    Meme regle que les erreurs de collecte : observe > expected -> FAIL.

# -----------------------------------------------------------------------------
# GATING
# -----------------------------------------------------------------------------
gating:
  rule: >
    Ce changement modifie-t-il ce que le moteur REGARDE, ou seulement ce qu'il MONTRE ?
    MONTRE => executable, N inchange. REGARDE => GATED, reset d'epoque, ADR signe.
  default_on_doubt: GATED
  sensitive_symbols:
    - PositionManager
    - check_new_trade
    - sizing
    - risk
    - PortfolioBrain (en entree de decision)
    - seuils par regime
    - CLEAN_DATA_SINCE_*
  epoch_gate_preconditions:
    - id: P1
      text: "Checkpoint L2 du projet franchi"
      met: false
    - id: P2
      text: "N >= 100 atteint sur l'epoque V4 (CLEAN_DATA_SINCE_V4 = 2026-07-17T01:30:00Z)"
      met: false
    - id: P3
      text: "Rapport PORT-001 produit et lu par l'operateur"
      met: false
    - id: P4
      text: "ADR d'epoque redige et signe par l'operateur"
      met: false

