# -----------------------------------------------------------------------------
# EXTENSIONS PROPOSEES DU PROTOCOLE — NON IMPLEMENTEES, DELIBEREMENT
#
# Quatre lacunes conceptuelles identifiees pour v4.0. AUCUNE n'est implementee :
# les construire maintenant violerait INV-ROI-001 (motivees par une idee, pas
# par une observation) et la regle de formation d'INV-RESTORE-001 (une regle
# ecrite sans incident constate est de la superstition).
#
# Le protocole leur est applique : chacune est classee selon qu'elle repose sur
# une OBSERVATION reelle ou sur une HYPOTHESE theorique. Cette distinction
# decide de leur priorite.
# -----------------------------------------------------------------------------
proposed_extensions:

  - id: EXT-004
    title: "Couche TEMPORALITE : valid_from / valid_until / TTL / evenement invalidant"
    epistemic_status: OBSERVATION
    evidence: >
      INSTANCE CONSTATEE dans cette session meme : la health_baseline a ete
      mesuree au commit 8cb42fb, puis utilisee pour juger les commits e83266b
      et suivants. Entre les deux, le code avait change. J'ai traite une
      observation PERIMEE comme courante, et aucune regle du protocole ne l'a
      signale. Le protocole suppose implicitement qu'une observation reste
      valide pendant toute la chaine.
    why_it_matters: >
      Une observation expiree n'est pas FAUSSE, elle est EXPIREE — etat
      different, traitement different. Sur un carnet d'ordres a TTL 30 s, la
      distinction decide de la validite d'une decision.
    priority: P1
    reason_priority: "seule des quatre a reposer sur une observation, pas une hypothese"
    status: PROPOSEE
    second_instance: >
      AUDIT-EMP-001 (2026-07-28) : gate_d_calibration consommait un rapport de
      burn-in vieux de 559.8 h (genere le 2026-07-05, count=0) comme s'il
      decrivait l'etat courant. Aucune regle ne l'a signale. Deuxieme instance
      constatee, sur un objet different de la premiere (artefact JSON produit
      par un autre outil, et non mesure en memoire).
    mitigation_locale: >
      Un controle de fraicheur ponctuel a ete pose SUR CE SEUL artefact
      (PRELIVE_BURNIN_MAX_AGE_H, defaut 24 h), motive par l'instance constatee.
      Ce n'est PAS l'implementation de la couche generique : aucune declaration
      valid_from/valid_until/TTL n'est exigee ailleurs. L'extension reste
      PROPOSEE ; deux instances ne font pas encore une regle transversale.

  - id: EXT-002
    title: "Tracabilite des transformations (TR-id, version, auteur, audits impactes)"
    epistemic_status: OBSERVATION_PARTIELLE
    evidence: >
      render_docs.py EST une transformation (manifest -> vues). Son historique
      existe via git, mais aucune vue generee ne declare PAR QUELLE VERSION du
      generateur elle a ete produite. Un changement du generateur invaliderait
      silencieusement les vues anterieures. Constate, non encore survenu.
    why_it_matters: >
      Une transformation modifiee six mois plus tard invalide potentiellement
      des audits passes, sans que rien ne l'indique.
    priority: P2
    status: PROPOSEE

  - id: EXT-001
    title: "Composition des transformations : preconditions informationnelles"
    epistemic_status: OBSERVATION_PARTIELLE
    status_changed: >
      2026-07-28, AUDIT-EMP-001 : passe d'HYPOTHESE a OBSERVATION_PARTIELLE.
      La chaine paper_trades.jsonl -> burnin_v3.json -> gate_d_calibration est
      une composition reelle de ce depot ou l'etage aval exigeait deux
      preconditions informationnelles que l'etage amont ne declarait pas :
      meme population canonique, et fraicheur. Les deux etaient violees
      simultanement et silencieusement. Ce n'est pas encore le cas theorique
      "T1 detruit la distribution que T2 exige", mais c'en est la meme famille.
    evidence: >
      Instance partielle constatee (ci-dessus). Le cas general — une
      transformation declarant ses preconditions informationnelles de maniere
      verifiable — reste non observe : la correction posee est specifique a
      cette chaine, pas generique.
    why_it_matters: >
      Trois transformations enchainees ne sont pas trois transformations
      independantes : chacune modifie les hypotheses disponibles, l'information
      restante et les falsificateurs encore possibles.
    priority: P3
    reason_priority: "theorique — a valider par la campagne avant implementation"
    status: PROPOSEE

  - id: EXT-003
    title: "Classes d'equivalence : lossless / lossy / approximation / projection / agregation"
    epistemic_status: HYPOTHESE
    evidence: >
      AUCUNE instance constatee. Le protocole exige deja information_loss et
      reversibility par transformation ; une taxonomie ajouterait de la
      normalisation, pas une capacite nouvelle. Risque de sur-ingenierie.
    why_it_matters: >
      Permettrait un raisonnement automatique sur la perte attendue plutot
      qu'une declaration au cas par cas.
    priority: P3
    reason_priority: "recouvre partiellement des champs existants — valeur marginale a prouver"
    status: PROPOSEE

