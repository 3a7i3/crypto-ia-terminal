      portfolio_health reintroduirait silencieusement une incoherence
      d'affichage — le defaut meme que ce ticket corrige.
    blocks: "rien — informe le niveau de confiance, pas une decision"
    how_to_observe: >
      Test base sur des proprietes (hypothesis) generant des jeux de positions
