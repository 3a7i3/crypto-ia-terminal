# =============================================================================
# manifest.yaml — SOURCE DE VERITE UNIQUE du chantier de remediation SSoT
# =============================================================================
#
# Ce fichier est la SEULE chose qu'on edite a la main.
# INDEX.md, IMPLEMENTATION_QUEUE.md et les blocs d'etat de MASTER_ROADMAP.md /
# CHECKPOINTS.md en sont des VUES GENEREES :
#
#     python .claude/tools/render_docs.py
#
# Ne jamais editer a la main un fichier portant le marqueur GENERATED.
# En cas de divergence, la hierarchie de verite est :
#     git log  >  manifest.yaml  >  documents generes
#
# =============================================================================

meta:
  version: "1.0"
  updated: "2026-07-24"
  authority: "operateur (Mathieu)"
  renderer: ".claude/tools/render_docs.py"

project:
  name: crypto_ai_terminal
  chantier: "Remediation de la dette Single Source of Truth"
  problem: >
    Le panneau Telegram affiche simultanement "Positions: 3" et
    "Portfolio Exposure: 0.0%". Audit SSoT : 0 PASS / 1 WARNING / 8 FAIL.
  root_cause: >
    core/advisor_loop.py:6786 passe pos_manager.get_open() a portfolio_health(),
    or pos_manager est vide en mode paper : les positions vivent dans
    _virtual_portfolio (MexcSimulator). portfolio_brain.py:668-687 itere une
    liste vide => exposition 0.
  proof: "free_cash = 674.47 x 0.40 - 0 = 269.79 $, exactement la valeur affichee"
  hidden_consequence: >
    Les cinq controles de check_new_trade (portfolio_brain.py:121-190) s'executent
    sur un portefeuille percu comme vide : le gate est trop permissif.

