name: Cross-Stack Compatibility Gate

# O-02W-D3 — LOCAL CROSS-STACK COMPATIBILITY GATE.
#
# Proves that one canonical payload generated through the actual Python
# O-02W-C producer path travels unchanged through the real O-02W-D1
# FastAPI reader/route and is accepted, unaltered, by the real O-02W-D2
# frontend validator/cockpit. All artifacts are generated into a temporary
# directory at run time (tests/cross_stack/generate_fixtures.py); nothing
# here is a committed handwritten "golden" fixture. No exchange
# credentials, no VPS/network deployment. Deliberately separate from the
# repository-wide `ci.yml`/`frontend-ci.yml` gates.
#
# O-02W-D3-R1.1 Blocker A: deliberately NO `paths:` filter. A hand-picked
# path allowlist is fragile by construction — e.g. the producer directly
# imports `paper_trading/paper_portfolio_view.py` and
# `paper_trading/portfolio_status.py`, neither of which was covered by the
# R1 allowlist, and other indirect dependencies can silently reproduce the
# same gap in the future. The gate itself is short (a handful of steps),
# so the stronger scientific guarantee of running on every PR/push to
# `main` costs little and can never again miss a contract-affecting change
# through an incomplete manual list.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cross-stack-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-stack-compat:
    name: "CROSS-STACK COMPATIBILITY GATE"
    runs-on: ubuntu-latest

    # No secrets, no exchange access, no VPS/network deployment, and
    # deliberately no exchange-mode environment variable at all — the
    # compatibility gate uses only deterministic passive fakes and must
    # never advertise or depend on any exchange mode (paper/testnet/live).

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Python producer/reader/API integration tests
        run: pytest -q tests/cross_stack/

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate cross-stack fixtures (temporary directory, real producer path)
        run: python -m tests.cross_stack.generate_fixtures --out frontend/.cross-stack-fixtures

      - name: Frontend cross-stack compatibility test
        working-directory: frontend
        env:
          CROSS_STACK_FIXTURES_DIR: ${{ github.workspace }}/frontend/.cross-stack-fixtures
        run: npx vitest run src/test/crossStack.compat.test.tsx
