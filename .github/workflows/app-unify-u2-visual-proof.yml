name: Legacy UI Route Compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-unify-u2-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  u2-burn-in-visual:
    name: "LEGACY UI REDIRECT COMPATIBILITY"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          mkdir -p "$RUNNER_TEMP/playwright-tooling"
          npm install --prefix "$RUNNER_TEMP/playwright-tooling" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          ln -s "$RUNNER_TEMP/playwright-tooling/node_modules/playwright" node_modules/playwright
          node -e "const r=require.resolve('playwright');if(!r.startsWith(process.env.RUNNER_TEMP)){console.error('unexpected playwright',r);process.exit(1)}console.log('playwright resolved from',r)"
          node "$RUNNER_TEMP/playwright-tooling/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Start ephemeral Vite app
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 >/tmp/app-unify-u2-vite.log 2>&1 &
          echo $! >/tmp/app-unify-u2-vite.pid
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/paper-live/burn-in >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/paper-live/burn-in >/dev/null
      - name: Verify retired routes and absence of burn-in requests
        working-directory: frontend
        run: node scripts/capture_app_unify_u2_visual.mjs
      - name: Collect proof logs
        if: always()
        run: |
          mkdir -p frontend/artifacts/app-unify-u2/runtime
          cp /tmp/app-unify-u2-vite.log frontend/artifacts/app-unify-u2/runtime/vite.log 2>/dev/null || true
      - name: Upload retired route compatibility proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-unify-u2-retired-route-proof
          path: frontend/artifacts/app-unify-u2/
          if-no-files-found: error
          retention-days: 14
