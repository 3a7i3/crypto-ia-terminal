name: APP-UNIFY U2 Burn-in Visual Proof

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-unify-u2-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  u2-burn-in-visual:
    name: "APP-UNIFY U2 BURN-IN VISUAL PROOF"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start ephemeral Vite app
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 >/tmp/app-unify-u2-vite.log 2>&1 &
          echo $! >/tmp/app-unify-u2-vite.pid
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/paper-live/burn-in >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/paper-live/burn-in >/dev/null
      - name: Capture and assert U2 visual proof
        working-directory: frontend
        run: node scripts/capture_app_unify_u2_visual.mjs
      - name: Collect proof logs
        if: always()
        run: |
          mkdir -p frontend/artifacts/app-unify-u2/runtime
          cp /tmp/app-unify-u2-vite.log frontend/artifacts/app-unify-u2/runtime/vite.log 2>/dev/null || true
      - name: Upload U2 visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-unify-u2-burn-in-visual-proof
          path: frontend/artifacts/app-unify-u2/
          if-no-files-found: error
          retention-days: 14
