# Build documentaire sur PR ; publication uniquement sur décision manuelle.


# Badges à ajouter dans le README.md :
# ![Docs](https://github.com/<OWNER>/<REPO>/actions/workflows/sphinx.yml/badge.svg)
# ![GitHub Pages](https://img.shields.io/github/deployments/<OWNER>/<REPO>/github-pages)

name: Build & Deploy Sphinx Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - 'quant_hedge_ai/**'
      - 'scripts/copy_docs_for_sphinx.py'
      - '.github/workflows/sphinx.yml'
      - 'tests/governance/test_sphinx_publication_gate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
      - name: Verify publication boundary
        run: python tests/governance/test_sphinx_publication_gate.py -v
      - name: Copy Markdown files
        run: |
          python scripts/copy_docs_for_sphinx.py
      - name: Build Sphinx HTML
        run: |
          sphinx-build -b html docs docs/_build/html
      # linkcheck est un builder integre a Sphinx : aucun paquet a installer.
      # Le « pip install sphinx-linkcheck » precedent echouait systematiquement,
      # ce paquet n'existant pas sur PyPI.
      # continue-on-error : un lien externe mort ne doit pas bloquer la
      # publication de la documentation — le resultat reste consultable dans
      # les logs du job.
      - name: Check for broken links
        continue-on-error: true
        run: |
          sphinx-build -b linkcheck docs docs/_build/linkcheck
      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-docs-html
          path: docs/_build/html

  publish-docs:
    needs: validate-docs
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated HTML
        uses: actions/download-artifact@v4
        with:
          name: sphinx-docs-html
          path: docs/_build/html
      - name: Deploy to GitHub Pages
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
      - name: Notify Discord (optionnel)
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            STATUS=$(if [ ${{ job.status }} == 'success' ]; then echo '🟢'; else echo '🔴'; fi)
            curl -H "Content-Type: application/json" -d '{"content": "'$STATUS' Build Sphinx Docs: ${{ github.repository }} @ ${{ github.sha }}"}' $DISCORD_WEBHOOK
          fi
      - name: Notify Slack (optionnel)
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            STATUS=$(if [ ${{ job.status }} == 'success' ]; then echo ':white_check_mark:'; else echo ':x:'; fi)
            curl -X POST -H 'Content-type: application/json' --data '{"text":"'$STATUS' Build Sphinx Docs: ${{ github.repository }} @ ${{ github.sha }}"}' $SLACK_WEBHOOK
          fi
