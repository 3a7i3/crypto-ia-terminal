# .github/workflows/orchestrator-healthcheck.yml
# Current contract: source/unit integrity for the orchestration surface that
# actually exists. There is no active orchestrator HTTP health endpoint.

name: Orchestration Integrity Check

on:
  push:
    branches: [ main ]
    paths-ignore:
      - audit_requests/**
      - audit_results/**
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest requests
      - name: Prove stale health surface is retired
        run: |
          test ! -e orchestration/orchestrate_all.ps1
          test ! -e orchestration/healthcheck_orchestrator.py
      - name: Parse current orchestration sources
        run: |
          python -m py_compile core/orchestration/orchestrate_all.py
          python -m py_compile core/orchestration/orchestrate_ecosystem.py
      - name: Exercise current mocked orchestration contract
        env:
          PYTHONPATH: ${{ github.workspace }}/core/orchestration:${{ github.workspace }}
        run: python -m pytest -q tests/root/test_orchestrate_ecosystem.py
