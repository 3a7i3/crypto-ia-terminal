name: OPS-C MASTER normalization fix

on:
  push:
    branches:
      - master/ops-c-market-universe-01
    paths:
      - .ops-c-master-trigger

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use canonical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply minimal MASTER fix
        run: |
          python - <<'PY'
          from pathlib import Path

          advisor = Path("core/advisor_loop.py")
          src = advisor.read_text(encoding="utf-8")
          old = '''def _validated_in_both_domains(execution_cert: Any, scan_cert: Any) -> list[str]:
    """Intersection ordonnée des symboles validés par les deux domaines."""
    execution_valid = set(execution_cert.validated_symbols)
    scan_valid = set(scan_cert.validated_symbols)
    return [
        symbol
        for symbol in execution_cert.configured_symbols
        if symbol in execution_valid and symbol in scan_valid
    ]
'''
          new = '''def _validated_in_both_domains(execution_cert: Any, scan_cert: Any) -> list[str]:
    """Intersection canonique ordonnée des symboles validés dans les deux domaines."""
    execution_valid = list(execution_cert.validated_symbols)
    scan_valid = set(scan_cert.validated_symbols)
    return [
        symbol
        for symbol in execution_valid
        if symbol in scan_valid
    ]
'''
          if src.count(old) != 1:
              raise SystemExit("MASTER target helper not found exactly once")
          advisor.write_text(src.replace(old, new), encoding="utf-8")

          core = Path("core/universe_certification.py")
          core_src = core.read_text(encoding="utf-8")
          replacements = {
              '"""Find only the ticker belonging to the selected derivative market."""':
                  '"""Find only the ticker belonging to the selected certified market."""',
              '    derivative market exists, is not explicitly inactive, and has a finite\n':
                  '    allowed market exists, is not explicitly inactive, and has a finite\n',
          }
          for old_text, new_text in replacements.items():
              if core_src.count(old_text) != 1:
                  raise SystemExit(f"MASTER documentation target not found exactly once: {old_text!r}")
              core_src = core_src.replace(old_text, new_text)
          core.write_text(core_src, encoding="utf-8")

          tests = Path("tests/test_advisor_loop_universe_certification_wiring.py")
          test_src = tests.read_text(encoding="utf-8")
          marker = "def test_settle_suffixed_pin_normalizes_dual_domain_intersection"
          if marker in test_src:
              raise SystemExit("MASTER regression test already exists")
          test_src += '''\n\ndef test_settle_suffixed_pin_normalizes_dual_domain_intersection(\n    monkeypatch, _artifact_path\n):\n    markets, tickers = _dual_domain_markets_tickers(\n        "BTC/USDT:USDT", "BTC/USDT", 65000.0\n    )\n    _patch_same_evidence(monkeypatch, markets, tickers)\n\n    symbols, snapshot = advisor_loop._resolve_pinned_universe_boot(\n        ["BTC/USDT:USDT"]\n    )\n\n    assert symbols == ["BTC/USDT"]\n    assert snapshot == {"n_symbols_configured": 1, "n_symbols_validated": 1}\n    payload = json.loads(_artifact_path.read_text(encoding="utf-8"))\n    assert payload["validated_symbols"] == ["BTC/USDT"]\n'''
          tests.write_text(test_src, encoding="utf-8")
          PY

          python -m py_compile core/advisor_loop.py core/universe_certification.py
          git diff --check

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install ruff==0.15.8

      - name: Targeted OPS-C suite
        run: |
          pytest -q \
            tests/test_advisor_loop_universe_certification_wiring.py \
            tests/test_perp_universe_builder_raw_evidence.py \
            tests/test_pre_t1_c_portfolio_provider_read_only.py \
            tests/test_universe_certification.py

      - name: Ruff regression gate
        run: python scripts/ci/ruff_baseline_gate.py check

      - name: Commit MASTER fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/advisor_loop.py \
            core/universe_certification.py \
            tests/test_advisor_loop_universe_certification_wiring.py
          git diff --cached --check
          git diff --cached --quiet && { echo "No MASTER fix to commit"; exit 1; }
          git commit -m "fix(ops-c): normalize dual-domain validated intersection"
          git push origin HEAD:master/ops-c-market-universe-01
