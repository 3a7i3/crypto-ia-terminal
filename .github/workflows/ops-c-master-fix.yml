name: OPS-C MASTER normalization fix

on:
  push:
    branches:
      - master/ops-c-market-universe-01
    paths:
      - .ops-c-master-trigger

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use canonical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply minimal MASTER fix
        run: |
          python .ops-c/master_normalization_fix.py
          python -m py_compile core/advisor_loop.py core/universe_certification.py
          git diff --check

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install ruff==0.15.8

      - name: Targeted OPS-C suite
        run: |
          pytest -q \
            tests/test_advisor_loop_universe_certification_wiring.py \
            tests/test_perp_universe_builder_raw_evidence.py \
            tests/test_pre_t1_c_portfolio_provider_read_only.py \
            tests/test_universe_certification.py

      - name: Ruff regression gate
        run: python scripts/ci/ruff_baseline_gate.py check

      - name: Commit MASTER fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/advisor_loop.py \
            core/universe_certification.py \
            tests/test_advisor_loop_universe_certification_wiring.py
          git diff --cached --check
          git diff --cached --quiet && { echo "No MASTER fix to commit"; exit 1; }
          git commit -m "fix(ops-c): normalize dual-domain validated intersection"
          git push origin HEAD:master/ops-c-market-universe-01
