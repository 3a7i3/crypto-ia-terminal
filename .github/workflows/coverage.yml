name: Coverage Report

on:
  push:
    branches: [main]
    paths-ignore:
      - audit_requests/**
      - audit_results/**
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      # Coverage publication excludes resource-sensitive performance/endurance
      # tests; those remain blocking in CI's LONG-RUN PERFORMANCE GATE.
      - name: Run deterministic coverage corpus
        run: pytest tests/ --ignore=tests/stress -m "not performance and not slow" --cov=. --cov-report=xml --cov-report=term-missing
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
