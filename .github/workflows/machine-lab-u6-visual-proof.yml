name: Machine Lab U6 Visual Proof

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: machine-lab-u6-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  machine-lab-u6-visual:
    name: "MACHINE LAB U6 VISUAL PROOF"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate synthetic fixtures through actual producers, publishers and API
        run: |
          pip install -r requirements-ci.txt
          python -m tests.cross_stack.generate_research_publication_fixture --out frontend/.cross-stack-fixtures
          python -m tests.cross_stack.generate_fixtures --out frontend/.cross-stack-fixtures
          python -m tests.cross_stack.generate_scanner_fixture --out frontend/.cross-stack-fixtures
          python -m tests.cross_stack.generate_microstructure_fixture --out frontend/.cross-stack-fixtures
          python -m tests.cross_stack.generate_ppl_comparison_fixture --out frontend/.cross-stack-fixtures
          python -m tests.cross_stack.generate_burn_in_fixture --out frontend/.cross-stack-fixtures
          python -m tests.cross_stack.generate_runtime_service_fixture --out frontend/.cross-stack-fixtures
          python -m tests.cross_stack.generate_strategy_board_fixture --out frontend/.cross-stack-fixtures
          python -m tests.cross_stack.generate_financial_clarity_fixture --out frontend/.cross-stack-fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start ephemeral Vite app
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 >/tmp/machine-lab-u6-vite.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/research >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/research >/dev/null
      - name: Assert two spaces, criteria, exact financial values and responsive layouts
        working-directory: frontend
        run: node scripts/capture_machine_lab_u6_visual.mjs
      - name: Upload Machine/Lab visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-lab-u6-visual-proof
          path: frontend/artifacts/machine-lab-u6/
          if-no-files-found: error
          retention-days: 14
