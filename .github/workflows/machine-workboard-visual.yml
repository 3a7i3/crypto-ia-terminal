name: Machine Workboard Visual Proof
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/machine-workboard-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and verify routing boundary
        working-directory: frontend
        run: |
          npm run build
          npm test -- --run src/test/MachineWorkboard.test.tsx src/test/AppRouting.test.tsx src/test/DirectionOverview.test.tsx
      - name: Install browser tooling without changing lockfile
        working-directory: frontend
        run: |
          mkdir -p "$RUNNER_TEMP/workboard-browser"
          npm install --prefix "$RUNNER_TEMP/workboard-browser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          ln -s "$RUNNER_TEMP/workboard-browser/node_modules/playwright" node_modules/playwright
          node "$RUNNER_TEMP/workboard-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Capture local source UI only
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 3018 > "$RUNNER_TEMP/workboard-vite.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3018/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/capture_machine_workboard_visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: machine-workboard-source-visual
          path: frontend/artifacts/machine-workboard
          retention-days: 14
          if-no-files-found: error
