name: WEB-01 Market Visual Proof

# Ephemeral CI runtime proof for the read-only WEB-01 MARKET path.
# This is NOT a VPS/production deployment certification.
# It starts the real loopback Operator API + real Vite app against artifacts
# generated through the repository's producer paths, opens the UI in Chromium,
# clicks MARKET, asserts provenance/no execution presentation, and uploads a
# screenshot plus logs. No secrets, exchanges, Telegram, advisor or execution.

on:
  pull_request:
    branches: [main, "web-rl-01-three-domain-contract"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web01-market-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  market-visual-proof:
    name: "WEB-01 MARKET VISUAL PROOF"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install read-only API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install uvicorn==0.46.0

      - name: Generate real-path canonical and MARKET artifacts
        run: |
          rm -rf /tmp/web01-fixtures
          python -m tests.cross_stack.generate_fixtures --out /tmp/web01-fixtures
          python -m tests.cross_stack.generate_market_fixture --out /tmp/web01-fixtures
          test -s /tmp/web01-fixtures/_producer/A_minimal_canonical/operator_snapshot.json
          test -s /tmp/web01-fixtures/_producer/A_minimal_canonical/operator_runtime_manifest.json
          test -s /tmp/web01-fixtures/_producer/G_market/cryptoradar_market_snapshot.json

      - name: Start loopback Operator API
        env:
          OPERATOR_SNAPSHOT_PATH: /tmp/web01-fixtures/_producer/A_minimal_canonical/operator_snapshot.json
          OPERATOR_RUNTIME_MANIFEST_PATH: /tmp/web01-fixtures/_producer/A_minimal_canonical/operator_runtime_manifest.json
          RADAR_MARKET_SNAPSHOT_PATH: /tmp/web01-fixtures/_producer/G_market/cryptoradar_market_snapshot.json
          OPERATOR_API_DEV_PORT: "8090"
        run: |
          nohup python -m observability.operator_api.dev_server >/tmp/web01-api.log 2>&1 &
          echo $! >/tmp/web01-api.pid
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8090/healthz
          curl --fail --silent http://127.0.0.1:8090/api/operator/v1/snapshot >/tmp/web01-snapshot-response.json
          curl --fail --silent http://127.0.0.1:8090/api/operator/v1/market >/tmp/web01-market-response.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start real Vite app through loopback API proxy
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 >/tmp/web01-vite.log 2>&1 &
          echo $! >/tmp/web01-vite.pid
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null

      - name: Capture and assert MARKET visual proof
        working-directory: frontend
        run: node scripts/capture_web01_market_visual.mjs

      - name: Collect proof bundle
        if: always()
        run: |
          mkdir -p frontend/artifacts/runtime
          cp /tmp/web01-api.log frontend/artifacts/runtime/api.log 2>/dev/null || true
          cp /tmp/web01-vite.log frontend/artifacts/runtime/vite.log 2>/dev/null || true
          cp /tmp/web01-snapshot-response.json frontend/artifacts/runtime/operator-snapshot-response.json 2>/dev/null || true
          cp /tmp/web01-market-response.json frontend/artifacts/runtime/market-response.json 2>/dev/null || true
          cp /tmp/web01-fixtures/G_market.json frontend/artifacts/runtime/G_market-cross-stack.json 2>/dev/null || true

      - name: Upload WEB-01 visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web01-market-visual-proof
          path: frontend/artifacts/
          if-no-files-found: error
          retention-days: 14
