name: OPS-A Radar polling fix

on:
  push:
    branches:
      - master/ops-a-radar-poll-01
    paths:
      - .github/workflows/ops-a-radar-fix.yml

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply minimal Radar polling fix and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("scripts/radar_bot.py")
          src = p.read_text(encoding="utf-8")

          old = '''ALLOWED_CHATS = {CHAT_ID} if CHAT_ID else set()

          def tg_request(method, payload=None):
              url = f"https://api.telegram.org/bot{TOKEN}/{method}"
              if payload:
                  data = json.dumps(payload).encode("utf-8")
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
              else:
                  req = urllib.request.Request(url)
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return json.loads(resp.read().decode())
          '''
          new = '''ALLOWED_CHATS = {CHAT_ID} if CHAT_ID else set()

          # Telegram getUpdates uses a server-side long poll.  The HTTP client timeout must
          # remain strictly longer than that server-side timeout, otherwise urllib can abort
          # a healthy idle poll before Telegram is allowed to return it.
          TELEGRAM_HTTP_TIMEOUT_S = 15
          TELEGRAM_LONG_POLL_TIMEOUT_S = 30
          TELEGRAM_LONG_POLL_GRACE_S = 10
          TELEGRAM_LONG_POLL_HTTP_TIMEOUT_S = (
              TELEGRAM_LONG_POLL_TIMEOUT_S + TELEGRAM_LONG_POLL_GRACE_S
          )

          def tg_request(method, payload=None, *, http_timeout_s=TELEGRAM_HTTP_TIMEOUT_S):
              url = f"https://api.telegram.org/bot{TOKEN}/{method}"
              if payload:
                  data = json.dumps(payload).encode("utf-8")
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
              else:
                  req = urllib.request.Request(url)
              with urllib.request.urlopen(req, timeout=http_timeout_s) as resp:
                  return json.loads(resp.read().decode())
          '''
          if src.count(old) != 1:
              raise SystemExit("tg_request target not found exactly once")
          src = src.replace(old, new)

          old_poll = '            result = tg_request("getUpdates", {"timeout": 30, "offset": offset})\n'
          new_poll = '''            result = tg_request(
                          "getUpdates",
                          {"timeout": TELEGRAM_LONG_POLL_TIMEOUT_S, "offset": offset},
                          http_timeout_s=TELEGRAM_LONG_POLL_HTTP_TIMEOUT_S,
                      )
          '''
          if src.count(old_poll) != 1:
              raise SystemExit("poll-loop target not found exactly once")
          p.write_text(src.replace(old_poll, new_poll), encoding="utf-8")

          Path("tests/test_radar_bot_poll_timeout.py").write_text('''import pytest

          from scripts import radar_bot


          class _Response:
              def __enter__(self):
                  return self

              def __exit__(self, exc_type, exc, tb):
                  return False

              def read(self):
                  return b'{"ok": true, "result": []}'


          def test_tg_request_forwards_explicit_http_timeout(monkeypatch):
              seen = {}

              def fake_urlopen(_request, timeout):
                  seen["timeout"] = timeout
                  return _Response()

              monkeypatch.setattr(radar_bot.urllib.request, "urlopen", fake_urlopen)

              result = radar_bot.tg_request(
                  "getUpdates",
                  {"timeout": radar_bot.TELEGRAM_LONG_POLL_TIMEOUT_S},
                  http_timeout_s=radar_bot.TELEGRAM_LONG_POLL_HTTP_TIMEOUT_S,
              )

              assert result["ok"] is True
              assert seen["timeout"] == radar_bot.TELEGRAM_LONG_POLL_HTTP_TIMEOUT_S


          def test_long_poll_http_timeout_exceeds_server_timeout():
              assert (
                  radar_bot.TELEGRAM_LONG_POLL_HTTP_TIMEOUT_S
                  > radar_bot.TELEGRAM_LONG_POLL_TIMEOUT_S
              )


          def test_poll_loop_uses_long_poll_http_timeout(monkeypatch):
              calls = []

              def fake_tg_request(method, payload=None, *, http_timeout_s):
                  calls.append((method, payload, http_timeout_s))
                  raise KeyboardInterrupt

              monkeypatch.setattr(radar_bot, "tg_request", fake_tg_request)

              with pytest.raises(KeyboardInterrupt):
                  radar_bot.poll_loop()

              assert calls == [
                  (
                      "getUpdates",
                      {"timeout": radar_bot.TELEGRAM_LONG_POLL_TIMEOUT_S, "offset": 0},
                      radar_bot.TELEGRAM_LONG_POLL_HTTP_TIMEOUT_S,
                  )
              ]
          ''', encoding="utf-8")
          PY

      - name: Verify focused contract
        run: |
          python -m py_compile scripts/radar_bot.py tests/test_radar_bot_poll_timeout.py
          python -m pip install -q pytest
          pytest -q tests/test_radar_bot_poll_timeout.py
          git diff --check

      - name: Commit clean OPS-A diff
        run: |
          rm .github/workflows/ops-a-radar-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/radar_bot.py tests/test_radar_bot_poll_timeout.py .github/workflows/ops-a-radar-fix.yml
          git diff --cached --check
          git commit -m "fix(ops-a): align Radar HTTP timeout with Telegram long poll"
          git push origin HEAD:master/ops-a-radar-poll-01
