name: Upload coverage to Codecov

on:
  push:
    branches: [main]
    paths-ignore:
      - audit_requests/**
      - audit_results/**
  pull_request:
    branches: [main, "web-rl-01-three-domain-contract"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codecov-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      # Coverage publication excludes resource-sensitive performance/endurance
      # tests; those remain blocking in CI's LONG-RUN PERFORMANCE GATE.
      - name: Run deterministic coverage corpus
        run: pytest tests/ --ignore=tests/stress -m "not performance and not slow" --cov=. --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # External publication is supplemental; Coverage Report remains the binding test evidence.
          fail_ci_if_error: false
