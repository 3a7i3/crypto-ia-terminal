name: Frontend CI

# O-02W-D2-R1 Correction E — narrowly scoped gate for the read-only React
# operator cockpit only. No secret, no deployment, no VPS operation. Does
# not touch or repair any existing Python workflow/gate.

on:
  pull_request:
    branches: [main, "web-rl-01-three-domain-contract"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --run
      - name: Run frontend runtime contracts
        run: npm run test:runtime
      - name: Production build
        run: npm run build
      - name: Diff hygiene (pull request)
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Diff hygiene (push)
        if: github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        run: git diff --check "${{ github.event.before }}...${{ github.sha }}"
