name: OPS-A relocate historical Ruff keys

on:
  push:
    branches:
      - master/ops-a-radar-poll-01
    paths:
      - .github/workflows/ops-a-ruff-relocate.yml

permissions:
  contents: write

jobs:
  relocate-verify-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Relocate only the three historical Radar findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.ci/ruff_baseline.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          before = list(data['findings'])
          replacements = {
              'scripts/radar_bot.py:155:9:F541': 'scripts/radar_bot.py:165:9:F541',
              'scripts/radar_bot.py:167:23:F541': 'scripts/radar_bot.py:177:23:F541',
              'scripts/radar_bot.py:282:11:F541': 'scripts/radar_bot.py:292:11:F541',
          }

          for old, new in replacements.items():
              if before.count(old) != 1:
                  raise SystemExit(f'expected historical key exactly once: {old}')
              if new in before:
                  raise SystemExit(f'new relocated key unexpectedly already present: {new}')

          after = [replacements.get(item, item) for item in before]
          if len(after) != len(before):
              raise SystemExit('baseline cardinality changed')
          if len(set(after)) != len(after):
              raise SystemExit('baseline uniqueness changed')
          changed = [(a, b) for a, b in zip(before, after) if a != b]
          if changed != list(replacements.items()):
              raise SystemExit(f'unexpected baseline diff: {changed!r}')

          data['findings'] = sorted(after)
          if data.get('count') != len(before) or data.get('count') != len(after):
              raise SystemExit('baseline count metadata inconsistent')
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'relocated={len(changed)} baseline_count={len(after)}')
          PY

      - name: Verify exact-head lint and focused Radar contract
        run: |
          pip install -q ruff==0.15.8 pytest
          python scripts/ci/ruff_baseline_gate.py check
          pytest -q tests/test_radar_bot_poll_timeout.py
          git diff --check

      - name: Commit clean baseline relocation
        run: |
          rm .github/workflows/ops-a-ruff-relocate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/ruff_baseline.json .github/workflows/ops-a-ruff-relocate.yml
          git diff --cached --check
          git commit -m "chore(ops-a): relocate historical Radar Ruff baseline keys"
          git push origin HEAD:master/ops-a-radar-poll-01
