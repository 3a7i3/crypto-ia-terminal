name: APP-UNIFY U8 VPS prep

on:
  pull_request:
    paths:
      - "deploy/app_unify_u8/**"
      - "docs/runbooks/APP_UNIFY_U8_VPS_DEPLOYMENT_PREP.md"
      - "observability/operator_api/runtime_service_reader.py"
      - "observability/operator_api/market_microstructure_reader.py"
      - "observability/operator_api/research_lab_reader.py"
      - "observability/operator_api/research_strategy_board_reader.py"
      - "scripts/app_unify_u8_preflight.py"
      - "tests/test_app_unify_u8_preflight.py"
      - ".github/workflows/app-unify-u8-prep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  u8-source-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve exact source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install targeted test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: U8 local-only preflight
        run: python scripts/app_unify_u8_preflight.py --expected-sha "${{ steps.source.outputs.sha }}"

      - name: U8 targeted tests
        run: pytest -q tests/test_app_unify_u8_preflight.py

  u8-frontend-build-and-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Deterministic install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Runtime transport tests
        run: npm run test:runtime

      - name: Capture npm audit evidence
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-u8.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-unify-u8-npm-audit
          path: frontend/npm-audit-u8.json
          if-no-files-found: error
          retention-days: 14

      - name: Report security debt without auto-fix
        if: always()
        shell: bash
        run: |
          echo "SEC-WEB-DEPS-01 audit exit code: ${{ steps.audit.outputs.exit_code }}"
          echo "No npm audit fix --force is executed by this workflow."
