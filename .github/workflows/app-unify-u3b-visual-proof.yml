name: APP-UNIFY U3b Microstructure Visual Proof

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-unify-u3b-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  u3b-microstructure-visual:
    name: "APP-UNIFY U3B MICROSTRUCTURE VISUAL PROOF"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate fixture through real passive producer and API
        run: |
          pip install fastapi httpx
          python -m tests.cross_stack.generate_microstructure_fixture --out frontend/.cross-stack-fixtures
          python -m tests.cross_stack.generate_scanner_fixture --out frontend/.cross-stack-fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start ephemeral Vite app
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 >/tmp/app-unify-u3b-vite.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/paper-live/market >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/paper-live/market >/dev/null
      - name: Assert desktop/mobile independent microstructure source, per-symbol freshness and failure states
        working-directory: frontend
        run: node scripts/capture_app_unify_u3b_visual.mjs
      - name: Upload microstructure visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-unify-u3b-microstructure-visual-proof
          path: frontend/artifacts/app-unify-u3b/
          if-no-files-found: error
          retention-days: 14
