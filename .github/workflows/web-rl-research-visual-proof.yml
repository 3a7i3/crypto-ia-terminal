name: WEB-RL Research Visual Proof

# WEB-RL-01 — ephemeral CI browser proof for the passive Research Lab path.
# This is NOT a VPS/production deployment certification.
# No secrets, exchanges, Telegram, advisor execution, PPL writes, candidate
# promotion or runtime mutation are used.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-rl-research-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-visual-proof:
    name: "WEB-RL RESEARCH VISUAL PROOF"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install read-only API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install uvicorn==0.46.0

      - name: Generate canonical and Research presentation artifacts
        run: |
          rm -rf /tmp/web-rl-fixtures
          python -m tests.cross_stack.generate_fixtures --out /tmp/web-rl-fixtures
          python -m tests.cross_stack.generate_research_lab_fixture --out /tmp/web-rl-fixtures
          test -s /tmp/web-rl-fixtures/_producer/A_minimal_canonical/operator_snapshot.json
          test -s /tmp/web-rl-fixtures/_producer/A_minimal_canonical/operator_runtime_manifest.json
          test -s /tmp/web-rl-fixtures/_producer/I_research_lab/research_lab_snapshot.json

          mkdir -p databases/research_presentation
          cp             /tmp/web-rl-fixtures/_producer/I_research_lab/research_lab_snapshot.json             databases/research_presentation/research_lab_snapshot.json

      - name: Start loopback Operator API
        env:
          OPERATOR_SNAPSHOT_PATH: /tmp/web-rl-fixtures/_producer/A_minimal_canonical/operator_snapshot.json
          OPERATOR_RUNTIME_MANIFEST_PATH: /tmp/web-rl-fixtures/_producer/A_minimal_canonical/operator_runtime_manifest.json
          OPERATOR_API_DEV_PORT: "8090"
        run: |
          nohup python -m observability.operator_api.dev_server >/tmp/web-rl-api.log 2>&1 &
          echo $! >/tmp/web-rl-api.pid
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8090/healthz
          curl --fail --silent http://127.0.0.1:8090/api/operator/v1/snapshot >/tmp/web-rl-snapshot-response.json
          curl --fail --silent http://127.0.0.1:8090/api/operator/v1/research-lab >/tmp/web-rl-research-response.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start real Vite app through loopback API proxy
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 >/tmp/web-rl-vite.log 2>&1 &
          echo $! >/tmp/web-rl-vite.pid
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null

      - name: Capture and assert Research Lab visual proof
        working-directory: frontend
        run: node scripts/capture_web_rl_research_visual.mjs

      - name: Collect proof bundle
        if: always()
        run: |
          mkdir -p frontend/artifacts/runtime
          cp /tmp/web-rl-api.log frontend/artifacts/runtime/api.log 2>/dev/null || true
          cp /tmp/web-rl-vite.log frontend/artifacts/runtime/vite.log 2>/dev/null || true
          cp /tmp/web-rl-snapshot-response.json frontend/artifacts/runtime/operator-snapshot-response.json 2>/dev/null || true
          cp /tmp/web-rl-research-response.json frontend/artifacts/runtime/research-lab-response.json 2>/dev/null || true
          cp /tmp/web-rl-fixtures/I_research_lab.json frontend/artifacts/runtime/I_research_lab-cross-stack.json 2>/dev/null || true

      - name: Upload WEB-RL visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-rl-research-visual-proof
          path: frontend/artifacts/
          if-no-files-found: error
          retention-days: 14
